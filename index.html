    ['Interfaccia', 'Rigenerazione', ['ricostruito', 'ricostruzione'], 'Il ricalcolo del solido a partire dall\'albero. Avviene da solo ogni volta che cambi una quota o una funzione (in SolidWorks è il «semaforo» Ricostruisci).'],
    ['Interfaccia', 'Annulla / Ripeti', ['annulla', 'ripeti'], 'Tornano indietro o avanti di un\'operazione (Ctrl+Z e Ctrl+Y). Dentro uno schizzo annullano i singoli tratti.'],
    ['Interfaccia', 'Anteprima', ['anteprima arancione', 'anteprima rossa'], 'Mentre il PropertyManager è aperto, il materiale che verrà aggiunto si vede in arancione e quello che verrà tolto in rosso. Il pezzo cambia davvero solo quando confermi con ✓.'],
    ['Interfaccia', 'Guida', ['come si fa', 'how to'], 'Il pannello con le istruzioni passo per passo di ogni comando: a cosa serve, come si fa, i consigli e i termini. Il pulsante «Mostrami dove» apre la scheda giusta e fa lampeggiare il comando.'],
    ['Interfaccia', 'Comandi del mouse', ['rotella', 'zoom', 'sposta', 'ruota'], 'Rotella: sposta il modello a destra e sinistra. Ctrl + rotella: ruota il modello attorno alla verticale. Maiusc + rotella: zoom verso il puntatore. Trascinando: tasto sinistro nel vuoto ruota, tasto destro (o Maiusc + sinistro) sposta. Su tablet: due dita ingrandiscono sempre; per ruotare e spostare tocca prima il pezzo, poi un dito ruota e due dita spostano. Tocca il vuoto per lasciarlo.'],
    ['Interfaccia', 'Isometrica', ['vista isometrica', 'iso'], 'Vista in cui i tre assi X, Y, Z formano angoli uguali sullo schermo: si vedono tre facce del pezzo insieme. È la vista standard per il modello 3D.'],
    ['Interfaccia', 'Normale a', ['vista normale'], 'Orienta la vista perpendicolare al piano o alla faccia scelta, così lo vedi «di fronte». Entrando in uno schizzo la vista si gira da sola normale al suo piano.'],
    ['Interfaccia', 'Adatta alla finestra', ['zoom adatta', 'adatta il foglio'], 'Zoom che fa entrare tutto il pezzo (o tutto il foglio, nella messa in tavola) nella finestra. In SolidWorks è il tasto F.'],
    ['Interfaccia', 'Terna degli assi', ['assi x y z', 'terna'], 'Le tre frecce in basso a sinistra: X rossa, Y verde, Z blu. Mostrano come è orientato il pezzo nella vista. Gli stessi colori si usano per gli assi tratteggiati dei piani.'],

    // ---------- riferimenti ----------
    ['Riferimenti', 'Origine', ['punto di origine'], 'Il punto (0, 0, 0) del pezzo, dove si incontrano i tre piani standard. Conviene disegnare il primo schizzo partendo dall\'origine: il pezzo resta ben posizionato e simmetrie e quote vengono più semplici.'],
    ['Riferimenti', 'Piano frontale', ['front'], 'Piano standard verticale che contiene gli assi X e Y (lo guardi da davanti). Si usa per il profilo principale dei pezzi visti di fronte.'],
    ['Riferimenti', 'Piano superiore', ['top'], 'Piano standard orizzontale che contiene gli assi X e Z (lo guardi dall\'alto). Si usa per piastre, basi e flange appoggiate.'],
    ['Riferimenti', 'Piano destro', ['right'], 'Piano standard verticale che contiene gli assi Z e Y (lo guardi da destra). È perpendicolare agli altri due.'],
    ['Riferimenti', 'Piano di riferimento', ['piano', 'riferimento'], 'Un piano in più, parallelo a un piano standard o a una faccia piana, a una certa distanza. Serve per fare schizzi «nell\'aria»: per esempio il profilo di arrivo di una sweep o una nervatura a metà pezzo.'],
    ['Riferimenti', 'Asse', ['asse x', 'asse y', 'asse z'], 'Retta di riferimento: per le serie circolari è l\'asse attorno a cui si ruota; si può prendere da uno degli assi X, Y, Z o dal pezzo (una faccia cilindrica o uno spigolo circolare).'],
    ['Riferimenti', 'Faccia', ['faccia piana', 'faccia cilindrica'], 'Una superficie del solido delimitata dagli spigoli. Le facce piane si possono usare per schizzi, piani e fori; quelle cilindriche danno l\'asse per le serie circolari.'],
    ['Riferimenti', 'Spigolo', ['spigoli'], 'La linea dove si incontrano due facce. Raccordi e smussi si fanno sugli spigoli; uno spigolo rettilineo può dare anche la direzione di una serie lineare.'],
    ['Riferimenti', 'Vertice', ['vertici'], 'Il punto dove si incontrano tre o più spigoli. Si usa per misurare le distanze.'],

    // ---------- schizzo ----------
    ['Schizzo', 'Schizzo', ['nuovo schizzo', 'schizzo 2d'], 'Disegno 2D su un piano o su una faccia piana: è la base di quasi tutte le funzioni. Prima si disegna la forma in modo approssimativo, poi la si precisa con relazioni e quote finché lo schizzo diventa nero.'],
    ['Schizzo', 'Completamente definito', ['nero', 'schizzo nero'], 'Lo schizzo è nero: forma e posizione sono fissate da relazioni e quote, nessun punto si può più trascinare. È lo stato giusto per un buon modello (in SolidWorks: «Completamente definito»).'],
    ['Schizzo', 'Sotto definito', ['blu', 'sottodefinito'], 'Lo schizzo (o una sua parte) è blu: manca ancora qualche quota o relazione, quindi qualcosa si può spostare trascinandolo. Il pezzo si può costruire lo stesso, ma è fragile se cambi le misure.'],
    ['Schizzo', 'Sovradefinito', ['rosso', 'sovra definito', 'in conflitto'], 'Lo schizzo è rosso: ci sono quote o relazioni in più o in contraddizione tra loro. Va tolta la quota o la relazione di troppo.'],
    ['Schizzo', 'Esci dallo schizzo', ['conferma lo schizzo'], 'Chiude lo schizzo e lo salva nell\'albero. Puoi anche premere direttamente un comando di funzione (Estrusione base…): lo schizzo si conferma da solo e viene usato.'],
    ['Schizzo', 'Linea', [], 'Segmenti consecutivi: un clic per ogni vertice, doppio clic o Esc per finire. Con l\'inserimento numerico puoi scrivere lunghezza e angolo.'],
    ['Schizzo', 'Rettangolo', ['rettangolo per angoli'], 'Rettangolo dato da due vertici opposti. Le relazioni orizzontale e verticale vengono aggiunte da sole.'],
    ['Schizzo', 'Rettangolo centrale', [], 'Rettangolo dato dal centro e da un vertice: è simmetrico rispetto al centro, comodo per pezzi centrati sull\'origine.'],
    ['Schizzo', 'Cerchio', [], 'Cerchio dato dal centro e da un punto della circonferenza. Si quota con il diametro (Ø).'],
    ['Schizzo', 'Arco centro-estremi', ['arco'], 'Arco dato dal centro, dal punto iniziale e da quello finale.'],
    ['Schizzo', 'Arco 3 punti', [], 'Arco che passa per tre punti: inizio, fine e un punto in mezzo.'],
    ['Schizzo', 'Arco tangente', [], 'Arco che parte dall\'estremo di una linea o di un arco continuando senza spigolo (tangente). È il modo giusto per fare i percorsi delle sweep e le asole.'],
    ['Schizzo', 'Poligono', ['poligono regolare'], 'Poligono regolare (esagono, ottagono…) inscritto in una circonferenza di costruzione: centro e un vertice. Il numero di lati si sceglie nel pannello.'],
    ['Schizzo', 'Asola', ['asola diritta'], 'Due semicerchi uniti da linee tangenti: è la forma delle cave per regolare la posizione delle viti.'],
    ['Schizzo', 'Punto', [], 'Punto dello schizzo: serve come riferimento per le quote o come posizione di un foro.'],
    ['Schizzo', 'Linea di mezzeria', ['mezzeria', 'centerline'], 'Linea di costruzione tratto-punto: non crea materiale. Serve come asse di rivoluzione, come asse di simmetria per «Specchia entità» e per la relazione Simmetrica.'],
    ['Schizzo', 'Geometria di costruzione', ['costruzione', 'linea di costruzione'], 'Entità tratteggiate che aiutano a disegnare (assi, cerchi di riferimento) ma non diventano facce del solido. Il comando «Costruzione» trasforma le entità selezionate e viceversa.'],
    ['Schizzo', 'Raccordo di schizzo', [], 'Arrotonda l\'angolo tra due linee con un arco tangente di raggio dato (clic sul vertice). Diverso dal Raccordo 3D, che lavora sugli spigoli del solido.'],
    ['Schizzo', 'Smusso di schizzo', [], 'Taglia l\'angolo tra due linee con un segmento inclinato (clic sul vertice).'],
    ['Schizzo', 'Taglia entità', ['trim'], 'Toglie la parte di un\'entità compresa tra due intersezioni: clic sul pezzo da togliere. Serve a ottenere contorni chiusi e senza incroci.'],
    ['Schizzo', 'Specchia entità', [], 'Copia simmetricamente le entità selezionate rispetto a una linea di mezzeria e aggiunge le relazioni di simmetria.'],
    ['Schizzo', 'Converti entità', [], 'Copia nello schizzo gli spigoli del pezzo (in grigio) selezionati, collegati al modello: se il pezzo cambia, cambiano anche loro.'],
    ['Schizzo', 'Geometria esterna', ['spigoli in grigio', 'in grigio'], 'Gli spigoli della faccia su cui stai disegnando, mostrati in grigio. Puoi agganciarti e quotare verso di loro (per esempio la distanza di un foro dal bordo).'],
    ['Schizzo', 'Aggancio', ['agganci', 'snap'], 'Quando avvicini il puntatore a un punto notevole (estremo, punto medio, centro, origine) il punto si «aggancia» e viene aggiunta la relazione giusta, per esempio Coincidente.'],
    ['Schizzo', 'Inserimento numerico', ['inserimento numerico – lunghezza e angolo'], 'Mentre disegni puoi scrivere i valori (lunghezza, angolo, diametro…) invece di cliccare. Accetta anche espressioni come 40/2. Con «Aggiungi le quote» i valori diventano quote.'],
    ['Schizzo', 'Quota intelligente', ['quota', 'quote'], 'Comando unico per tutte le quote: clic su una linea (lunghezza), su due linee (distanza o angolo), su un cerchio (diametro), su un arco (raggio) o su due punti; poi clic dove mettere la quota e scrivi il valore. È la quota di SolidWorks.'],
    ['Schizzo', 'Quota condotta', ['quota di riferimento'], 'Quota solo informativa, tra parentesi: mostra una misura ma non la impone. Si ottiene quando una quota normale sovradefinirebbe lo schizzo.'],
    ['Schizzo', 'Entità selezionate', ['elementi'], 'Le entità dello schizzo che hai selezionato (Ctrl+clic per sceglierne più di una). Il pannello mostra le relazioni che si possono aggiungere tra loro.'],
    ['Schizzo', 'Parametri', [], 'I valori dell\'entità selezionata (coordinate, lunghezza, raggio…). Se l\'entità non è vincolata li puoi cambiare scrivendo.'],
    ['Schizzo', 'Aggiungi relazione', ['relazioni', 'aggiungi relazioni', 'relazioni esistenti'], 'Vincoli geometrici tra entità (orizzontale, parallela, tangente…). Insieme alle quote rendono lo schizzo completamente definito. Seleziona le entità (Ctrl+clic) e scegli la relazione.'],
    ['Relazioni', 'Coincidente', [], 'Un punto sta su un altro punto, su una linea o su un arco. È la relazione che chiude i contorni.'],
    ['Relazioni', 'Orizzontale', [], 'La linea (o la congiungente di due punti) è parallela all\'asse X dello schizzo.'],
    ['Relazioni', 'Verticale', [], 'La linea (o la congiungente di due punti) è parallela all\'asse Y dello schizzo.'],
    ['Relazioni', 'Parallela', ['parallela (tutte)'], 'Due o più linee hanno la stessa direzione.'],
    ['Relazioni', 'Perpendicolare', [], 'Due linee formano un angolo di 90°.'],
    ['Relazioni', 'Collineare', [], 'Due linee stanno sulla stessa retta.'],
    ['Relazioni', 'Uguale', ['uguale (tutte)'], 'Linee della stessa lunghezza o cerchi e archi dello stesso raggio. Così basta una quota per tutti.'],
    ['Relazioni', 'Tangente', [], 'Un arco e una linea (o due archi) si toccano senza spigolo, con la stessa direzione nel punto di contatto.'],
    ['Relazioni', 'Concentrica', [], 'Cerchi o archi con lo stesso centro.'],
    ['Relazioni', 'Punto medio', [], 'Il punto sta a metà di una linea.'],
    ['Relazioni', 'Nel centro', [], 'Il punto coincide con il centro di un cerchio o di un arco.'],
    ['Relazioni', 'Simmetrica', [], 'Due punti (o due entità) sono simmetrici rispetto a una linea di mezzeria.'],
    ['Relazioni', 'Fissa', [], 'L\'entità non si può più muovere. Da usare poco: è meglio definire lo schizzo con quote e relazioni verso l\'origine.'],
    ['Relazioni', 'Punto su linea', ['punto su circonferenza'], 'Il punto sta sulla linea (o sulla circonferenza), anche fuori dal segmento disegnato.'],

    // ---------- funzioni ----------
    ['Funzioni', 'Funzione', ['funzioni'], 'Ogni operazione che crea o modifica il solido (estrusione, foro, raccordo…). Le funzioni sono nell\'albero e si possono modificare in ogni momento: il pezzo si aggiorna da solo (modellazione parametrica).'],
    ['Funzioni', 'Estrusione base', ['estrusione', 'estrudi'], 'Prende un contorno chiuso dello schizzo e lo «tira» perpendicolarmente al piano, creando materiale: un rettangolo diventa un parallelepipedo, un cerchio un cilindro.'],
    ['Funzioni', 'Taglio estruso', ['taglio-estrusione', 'taglio'], 'Come l\'estrusione, ma toglie materiale: tasche, fori sagomati, cave.'],
    ['Funzioni', 'Rivoluzione base', ['rivoluzione'], 'Fa ruotare un profilo chiuso attorno a una linea di mezzeria: alberi, perni, boccole, pomoli. Il profilo deve stare tutto da una parte dell\'asse.'],
    ['Funzioni', 'Taglio rivoluzione', ['taglio-rivoluzione'], 'Toglie materiale ruotando un profilo attorno a un asse: gole, scanalature circolari, sedi per anelli.'],
    ['Funzioni', 'Estrusione con percorso', ['sweep', 'percorso'], 'Fa scorrere un profilo chiuso lungo un percorso (linee e archi tangenti): tubi piegati, maniglie, molle a filo, guarnizioni. Servono due schizzi: il profilo e il percorso, su piani diversi; il percorso parte dal piano del profilo, perpendicolare a esso. In SolidWorks: «Base/Estrusione con percorso».'],
    ['Funzioni', 'Taglio con percorso', ['sweep cut'], 'Toglie materiale facendo scorrere un profilo lungo un percorso: canali, gole che girano, sedi per tubi.'],
    ['Funzioni', 'Profilo', ['profilo chiuso'], 'Il contorno chiuso che viene estruso, ruotato o fatto scorrere: è la «sezione» della funzione.'],
    ['Funzioni', 'Nervatura', ['rib'], 'Parete sottile di rinforzo (costola) tra due parti del pezzo, per esempio nell\'angolo di una squadretta. Si disegna solo una linea aperta: il materiale riempie lo spazio tra la linea e il pezzo, con lo spessore scelto. La linea viene prolungata da sola fino al pezzo.'],
    ['Funzioni', 'Spessore', [], 'Lo spessore della nervatura, misurato perpendicolarmente al piano dello schizzo: a metà per parte (piano medio) oppure tutto da un lato.'],
    ['Funzioni', 'Direzione del materiale', ['inverti il lato del materiale'], 'Da quale parte della linea della nervatura va il materiale. Di solito si trova da solo (verso il pezzo); «Inverti» sceglie l\'altro lato.'],
    ['Funzioni', 'Creazione guidata fori', ['foro', 'fori'], 'Fori secondo le norme: si sceglie il tipo e la vite (M3…M20) e i diametri vengono presi dalle tabelle. Si clicca su una faccia piana e si mettono le posizioni dei centri.'],
    ['Funzioni', 'Raccordo', ['raggio'], 'Arrotonda gli spigoli selezionati con una superficie circolare di raggio dato. Su uno spigolo esterno (convesso) toglie materiale, su uno interno (concavo) lo aggiunge. Tutti gli spigoli della stessa funzione si raccordano insieme, come in SolidWorks: dove due raccordi si incontrano si raccordano tra loro, dove se ne incontrano tre ad angolo retto l\'angolo diventa una porzione di sfera.'],
    ['Funzioni', 'Smusso', [], 'Taglia uno spigolo con una faccia inclinata. Tipi: distanza uguale (45°), distanza e angolo, due distanze. Sugli alberi si indica per esempio 1×45°.'],
    ['Funzioni', 'Serie lineare', ['serie'], 'Ripete una o più funzioni (fori, tagli, borchie…) lungo una o due direzioni, con distanza e numero di istanze.'],
    ['Funzioni', 'Serie circolare', [], 'Ripete funzioni attorno a un asse, per esempio i fori di una flangia. Con «spaziatura uguale» le istanze si distribuiscono sull\'angolo totale.'],
    ['Funzioni', 'Specchio', ['piano di simmetria'], 'Copia le funzioni scelte in modo simmetrico rispetto a un piano o a una faccia piana.'],
    ['Funzioni', 'Funzioni da ripetere', ['funzioni da specchiare'], 'Le funzioni (estrusioni, tagli, fori, sweep, nervature…) che la serie o lo specchio copiano. Si scelgono con un clic su una loro faccia nella vista o sul nome nell\'albero.'],
    ['Funzioni', 'Spigoli da raccordare', ['spigoli da smussare'], 'Gli spigoli su cui si applica il raccordo o lo smusso: clic sugli spigoli nella vista (diventano blu); un secondo clic li toglie.'],
    ['Funzioni', 'Profilo e percorso', [], 'I due schizzi dell\'estrusione con percorso: il profilo (contorno chiuso) e il percorso (linee e archi tangenti) lungo cui il profilo scorre.'],
    ['Funzioni', 'Istanze', ['numero di istanze'], 'Il numero totale di copie in una serie, contando anche l\'originale.'],
    ['Funzioni', 'Schizzo da estrudere', ['schizzo da tagliare', 'schizzo da far ruotare', 'schizzo della nervatura'], 'Lo schizzo usato dalla funzione. Si sceglie dall\'elenco o con un clic sulle sue linee nella vista; «Modifica lo schizzo» lo riapre.'],
    ['Funzioni', 'Asse di rivoluzione', [], 'La linea di mezzeria dello schizzo attorno a cui ruota il profilo.'],
    ['Funzioni', 'Angolo', ['angolo totale'], 'Per la rivoluzione: di quanto ruota il profilo (360° = giro completo). Per la serie circolare: l\'angolo su cui si distribuiscono le istanze.'],

    // ---------- condizioni finali e opzioni ----------
    ['Opzioni', 'Condizione finale', ['fino a'], 'Dice dove finisce l\'estrusione o il taglio: Cieca (a una profondità), Passante tutto (attraversa tutto il pezzo), Piano medio (metà profondità per parte).'],
    ['Opzioni', 'Cieca', ['cieca (profondità)'], 'La funzione si ferma alla profondità scritta. Un foro cieco non esce dall\'altra parte.'],
    ['Opzioni', 'Passante tutto', ['passante'], 'Il taglio attraversa tutto il pezzo, qualunque sia lo spessore: se il pezzo cambia, il foro resta passante.'],
    ['Opzioni', 'Piano medio', ['piano medio (metà per parte)', 'piano medio (metà angolo per parte)'], 'La funzione si estende metà da una parte e metà dall\'altra del piano dello schizzo: il pezzo resta simmetrico rispetto al piano.'],
    ['Opzioni', 'Profondità', [], 'Di quanto si estende l\'estrusione o il taglio a partire dal piano dello schizzo, in millimetri.'],
    ['Opzioni', 'Direzione 1', [], 'Il verso principale della funzione, normale al piano dello schizzo.'],
    ['Opzioni', 'Direzione 2', ['estrudi anche nella direzione opposta'], 'Estende la funzione anche dall\'altra parte del piano dello schizzo, con una sua profondità.'],
    ['Opzioni', 'Inverti la direzione', ['inverti'], 'Fa andare la funzione dalla parte opposta.'],
    ['Opzioni', 'Sformo', ['angolo di sformo', 'sformo verso l\'esterno'], 'Inclina le pareti dell\'estrusione dell\'angolo scritto: il profilo si restringe man mano che ci si allontana dal piano dello schizzo (o si allarga con «verso l\'esterno»). Serve per i pezzi stampati o fusi, così escono dallo stampo. Le facce piane diventano piani inclinati, quelle cilindriche coni.'],
    ['Opzioni', 'Distanza', [], 'Per i piani: la distanza dal riferimento. Per le serie: il passo tra un\'istanza e la successiva.'],

    // ---------- fori ----------
    ['Fori', 'Tipo di foro', [], 'Semplice (diametro libero), passante per vite (ISO 273), lamato per viti a testa cilindrica, svasato per viti a testa svasata, filettato (foro di preparazione per la maschiatura).'],
    ['Fori', 'Passante per vite', ['iso 273', 'accoppiamento (iso 273)'], 'Foro leggermente più grande della vite, così passa senza forzare. La norma ISO 273 dà tre serie: stretto (fine), normale (media), largo (grossolana). Per M6: Ø6,4 / Ø6,6 / Ø7.'],
    ['Fori', 'Lamatura', ['lamato', 'ø lamatura', 'profondità lamatura'], 'Allargamento cilindrico in cima al foro che accoglie la testa di una vite a testa cilindrica (ISO 4762), così la testa non sporge. Misure da DIN 974-1.'],
    ['Fori', 'Svasatura', ['svasato'], 'Allargamento conico a 90° in cima al foro per le viti a testa svasata (ISO 10642): la testa resta a filo della faccia. Misure da ISO 15065.'],
    ['Fori', 'Filettato', ['foro filettato', 'filetto', 'profondità del filetto'], 'Foro da maschiare: il modello mostra il foro di preparazione (per M6 Ø5), il filetto si indica in tavola con la designazione (M6). Passo grosso ISO.'],
    ['Fori', 'Punta a 118°', ['punta conica'], 'Il fondo conico lasciato dalla punta elicoidale nei fori ciechi. La profondità del foro si misura fino all\'inizio del cono.'],
    ['Fori', 'Grandezza', ['m6', 'filettatura metrica'], 'La misura della vite: M6 vuol dire filettatura metrica di diametro nominale 6 mm.'],
    ['Fori', 'Valori di norma', [], 'I diametri e le profondità presi dalle tabelle delle norme (ISO 273, DIN 974-1, ISO 15065) per la vite scelta. Si possono cambiare scrivendo un valore diverso.'],
    ['Fori', 'Posizioni', ['modifica le posizioni'], 'I punti dello schizzo dove vanno i centri dei fori. Si quotano come in un normale schizzo (per esempio dai bordi del pezzo).'],

    // ---------- valuta ----------
    ['Valuta', 'Proprietà di massa', ['massa'], 'Volume, area della superficie, massa e baricentro del pezzo, calcolati con le superfici esatte (cilindri, coni, sfere, tori), come in SolidWorks.'],
    ['Valuta', 'Volume', [], 'Lo spazio occupato dal solido, in mm³ (1 cm³ = 1000 mm³).'],
    ['Valuta', 'Area della superficie', ['area'], 'La somma delle aree di tutte le facce, in mm²: serve per esempio per la verniciatura.'],
    ['Valuta', 'Massa', [], 'Volume × densità del materiale. Con il materiale «Non specificato» si usa 1 g/cm³.'],
    ['Valuta', 'Baricentro', ['centro di massa'], 'Il punto in cui si può pensare concentrata tutta la massa (X, Y, Z rispetto all\'origine).'],
    ['Valuta', 'Materiale', ['densità'], 'Il materiale del pezzo (acciaio, alluminio, ottone, plastiche…). Ne determina la densità e quindi la massa.'],
    ['Valuta', 'Misura', [], 'Misura distanze, diametri e angoli tra facce, spigoli e vertici selezionati.'],
    ['Valuta', 'Vista in sezione', ['sezione'], 'Taglia la vista del modello con un piano per vedere l\'interno (non modifica il pezzo).'],
    ['Valuta', 'Autoverifica', ['autotest', 'collaudo'], 'Ricostruisce i pezzi di prova e confronta volume, area, baricentro e ingombro con i valori calcolati a mano. Serve a controllare che il programma calcoli giusto (errore ammesso: 1 %).'],
    ['Valuta', 'Ingombro', ['ingombri'], 'Le dimensioni massime del pezzo lungo X, Y e Z: il parallelepipedo più piccolo che lo contiene.'],

    // ---------- messa in tavola ----------
    ['Messa in tavola', 'Messa in tavola', ['tavola', 'disegno'], 'Il disegno tecnico 2D ricavato dal modello: viste in proiezione ortogonale, quote, cartiglio. Se il pezzo cambia, la tavola si aggiorna.'],
    ['Messa in tavola', 'Metodo E', ['metodo e, primo diedro', 'primo diedro', 'iso 5456-2'], 'Metodo di proiezione europeo (primo diedro, ISO 5456-2): la vista dall\'alto va sotto la vista frontale, la vista da sinistra va a destra. Il simbolo nel cartiglio è il tronco di cono.'],
    ['Messa in tavola', 'Proiezioni ortogonali', ['viste'], 'Le viste del pezzo ottenute guardandolo perpendicolarmente da davanti, dall\'alto, da sinistra… Ogni vista mostra due dimensioni vere.'],
    ['Messa in tavola', 'Linee nascoste', ['spigoli nascosti'], 'Gli spigoli che non si vedono perché coperti dal pezzo, disegnati con linea a tratti (ISO 128).'],
    ['Messa in tavola', 'Assi', ['linee d\'asse'], 'Le linee mista tratto-punto fine che indicano gli assi di fori e pezzi cilindrici (ISO 128).'],

// Test del nucleo geometrico del Banco CAD: ogni caso ha valori di riferimento calcolati a mano.
// Node: node kernel.test.js [cartella dei moduli]   (tolleranza relativa TOL, default 1%)
// Browser: SelfTest.run() restituisce le righe dei risultati.
(function (root) {
const isNode = typeof module !== 'undefined' && typeof window === 'undefined';
const path = isNode ? require('path') : null;
const dir = isNode ? path.resolve(process.argv[2] || path.join(__dirname, 'core')) : null;
const Model = isNode ? require(path.join(dir, 'model.js')) : root.Model;
const Sketch = isNode ? require(path.join(dir, 'sketch.js')) : root.Sketch;
const TOL = isNode ? +(process.env.TOL || 0.01) : 0.01;
const PI = Math.PI;

/* ---------- costruttori (come nelle esercitazioni) ---------- */
function SB() {
  const s = Sketch.newSketch();
  const pt = (x, y, extra = {}) => { const id = 'p' + (s.next++); s.ents.push({ id, t: 'pt', x, y, ...extra }); return id; };
  const api = {
    s, pt,
    line(a, b, extra = {}) { const id = 'l' + (s.next++); s.ents.push({ id, t: 'ln', a, b, ...extra }); return id; },
    poly(points) { const ids = points.map(([x, y]) => pt(x, y)); for (let i = 0; i < ids.length; i++) api.line(ids[i], ids[(i + 1) % ids.length]); return ids; },
    rect(x0, y0, x1, y1) { return api.poly([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]); },
    circle(cx, cy, r) { const c = pt(cx, cy); const id = 'c' + (s.next++); s.ents.push({ id, t: 'ci', c, r }); return id; },
    arc(c, a, b) { const id = 'a' + (s.next++); s.ents.push({ id, t: 'ar', c, a, b }); return id; },
    center(x0, y0, x1, y1) { return api.line(pt(x0, y0), pt(x1, y1), { cons: true, center: true }); },
  };
  return api;
}
function D0(name) { const d = Model.newDoc(); d.name = name; return d; }
function feat(doc, f) { f.id = f.id || Model.uid(doc, 'F'); f.name = f.name || Model.defaultName(doc, f.type); doc.features.push(f); return f.id; }
function sketch(doc, plane, b) { return feat(doc, { type: 'sketch', plane, sk: b.s }); }
const STD = id => ({ kind: 'std', id });
function face(doc, pred) {
  const st = Model.regen(doc);
  for (const id of new Set(st.body.map(p => p.t))) { const t = st.tags.get(id); if (t.kind === 'plane' && pred(t)) return { kind: 'face', name: t.name, n: t.n, w: t.w }; }
  throw new Error('faccia non trovata');
}
const nearW = (n, w) => t => Math.abs(t.n[0] - n[0]) < 1e-9 && Math.abs(t.n[1] - n[1]) < 1e-9 && Math.abs(t.n[2] - n[2]) < 1e-9 && Math.abs(t.w - w) < 1e-6;
function distPS(p, a, b) { const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]]; const L2 = ab[0] ** 2 + ab[1] ** 2 + ab[2] ** 2; let t = L2 ? ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1] + (p[2] - a[2]) * ab[2]) / L2 : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - a[0] - ab[0] * t, p[1] - a[1] - ab[1] * t, p[2] - a[2] - ab[2] * t); }
function edge(doc, p, kind) {
  const st = Model.regen(doc);
  let best = null, bd = Infinity;
  for (const g of Model.edgeGroups(st, st.topo).values()) {
    const geo = Model.edgeGeometry(g, st, st.topo); if (!geo) continue;
    if (kind && geo.kind !== kind) continue;
    for (const e of g.segs) { const d = distPS(p, st.topo.verts[e.a], st.topo.verts[e.b]); if (d < bd) { bd = d; best = { a: st.tags.get(g.t1).name, b: st.tags.get(g.t2).name, p }; } }
  }
  if (!best) throw new Error('spigolo non trovato');
  return best;
}
// blocco 80×50×10 sul piano superiore: x 0..80, z -50..0, y 0..10
function box(L = 80, W = 50, H = 10) {
  const doc = D0('blocco'); const b = SB(); b.rect(0, 0, L, W);
  const s = sketch(doc, STD('top'), b); feat(doc, { type: 'extrude', sketch: s, end: 'blind', depth: H }); return doc;
}

const topEdges = d => [edge(d, [40, 10, 0], 'line'), edge(d, [80, 10, -25], 'line'), edge(d, [40, 10, -50], 'line'), edge(d, [0, 10, -25], 'line')];
const allEdges = d => topEdges(d).concat([edge(d, [40, 0, 0], 'line'), edge(d, [80, 0, -25], 'line'), edge(d, [40, 0, -50], 'line'), edge(d, [0, 0, -25], 'line'),
  edge(d, [0, 5, 0], 'line'), edge(d, [80, 5, 0], 'line'), edge(d, [80, 5, -50], 'line'), edge(d, [0, 5, -50], 'line')]);
const miter = r => (5 / 3 - PI / 2) * r ** 3; // volume in comune tra i due utensili di raccordo che si incontrano ad angolo retto
T('Raccordo R4 su due spigoli che si incontrano in un vertice', () => {
  const d = box(); feat(d, { type: 'fillet', r: 4, edges: [edge(d, [40, 10, 0], 'line'), edge(d, [80, 10, -25], 'line')] }); return d;
}, { R: 16 * k * (80 + 50) - miter(4) });
T('Raccordo R4 sui 4 spigoli superiori (angoli a 45°)', () => {
  const d = box(); feat(d, { type: 'fillet', r: 4, edges: topEdges(d) }); return d;
}, { R: 16 * k * 2 * (80 + 50) - 4 * miter(4) });
T('Raccordo R3 su tutti i 12 spigoli (angoli sferici)', () => {
  const d = box(); feat(d, { type: 'fillet', r: 3, edges: allEdges(d) }); return d;
}, (() => { const r = 3, a = 80 - 2 * r, b = 50 - 2 * r, c = 10 - 2 * r;
  return { R: 40000 - (a * b * c) - ( 2 * r * (a * b + b * c + a * c) + PI * r * r * (a + b + c) + 4 / 3 * PI * r ** 3), A: 2 * (a * b + b * c + a * c) + 2 * PI * r * (a + b + c) + 4 * PI * r * r, bb: [[0, 0, -50], [80, 10, 0]] }; })());
T('Smusso 2 su due spigoli che si incontrano in un vertice', () => {
  const d = box(); feat(d, { type: 'chamfer', d: 2, edges: [edge(d, [40, 10, 0], 'line'), edge(d, [80, 10, -25], 'line')] }); return d;
}, { R: 2 * (80 + 50) - 8 / 3 }); // in comune tra i due cunei: ∫(d − y)² dy = d³/3
T('Smusso 2 sui 4 spigoli superiori', () => {
  const d = box(); feat(d, { type: 'chamfer', d: 2, edges: topEdges(d) }); return d;
}, { R: 2 * 2 * (80 + 50) - 4 * 8 / 3 });
T('Smusso 1 su tutti i 12 spigoli', () => {
  const d = box(); feat(d, { type: 'chamfer', d: 1, edges: allEdges(d) }); return d;
}, (() => { // inclusione-esclusione: cunei 0,5·d²·L, meno 3 coppie per vertice (d³/3), più la parte comune ai tre cunei (d³/4)
  const L = 4 * (80 + 50 + 10); return { R: 0.5 * L - 8 * 3 / 3 + 8 / 4 }; })());
// tutti gli spigoli di un blocco 40×30×20 (piano superiore): x 0..40, z -30..0, y 0..20
const allEdgesOf = d => { const st = Model.regen(d); const out = [];
  for (const g of Model.edgeGroups(st, st.topo).values()) { const e = g.segs[0], a = st.topo.verts[e.a], b = st.topo.verts[e.b]; out.push({ a: st.tags.get(g.t1).name, b: st.tags.get(g.t2).name, p: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2] }); }
  return out; };
const rbox = r => { const a = 40 - 2 * r, b = 30 - 2 * r, c = 20 - 2 * r; return { V: a * b * c + 2 * r * (a * b + b * c + a * c) + PI * r * r * (a + b + c) + 4 / 3 * PI * r ** 3, A: 2 * (a * b + b * c + a * c) + 2 * PI * r * (a + b + c) + 4 * PI * r * r }; };
T('Raccordo R6 su tutti gli spigoli di un blocco 40×30×20', () => { const d = box(40, 30, 20); feat(d, { type: 'fillet', r: 6, edges: allEdgesOf(d) }); return d; }, { ...rbox(6), bb: [[0, 0, -30], [40, 20, 0]] });
T('Raccordo R9,5 su tutti gli spigoli (facce quasi sparite)', () => { const d = box(40, 30, 20); feat(d, { type: 'fillet', r: 9.5, edges: allEdgesOf(d) }); return d; }, rbox(9.5));
T('Smusso 4 su tutti gli spigoli di un blocco 40×30×20', () => { const d = box(40, 30, 20); feat(d, { type: 'chamfer', d: 4, edges: allEdgesOf(d) }); return d; },

})());

})());
T('Sformo 8° verso l\'esterno, verso invertito', () => draftDoc(b => b.circle(0, 0, 10), 10, 8, { draftOut: true, flip: true }), (() => {

})());
T('Sformo 3° su quadrato con foro (il foro si allarga)', () => draftDoc(b => { b.rect(-20, -20, 20, 20); b.circle(0, 0, 8); }, 15, 3), (() => {

T('Massa acciaio S235 (blocco 80×50×10)', () => { const d = box(); d.material = 's235'; return d; }, { V: 40000, M: 40000 * 7.85 / 1000 });

/* ---------- schizzo: risolutore ---------- */
const SK = [];
SK.push(['Rettangolo quotato 80×50 (orizz./vert. + quote)', () => {
  const b = SB(); const [p1, p2, p3, p4] = b.rect(0, 0, 70, 45); const s = b.s;
  const L = s.ents.filter(e => e.t === 'ln');
  s.cons.push({ t: 'coincident', e: [p1, 'O'] }, { t: 'horizontal', e: [L[0].id] }, { t: 'vertical', e: [L[1].id] }, { t: 'horizontal', e: [L[2].id] }, { t: 'vertical', e: [L[3].id] },
    { t: 'len', e: [L[0].id], v: 80 }, { t: 'len', e: [L[1].id], v: 50 });
  const r = Sketch.solve(s); const E = Sketch.byId(s);
  return { ok: r.ok, got: [E.get(p3).x, E.get(p3).y], exp: [80, 50] };
}]);
SK.push(['Cerchio con diametro quotato 25', () => {
  const b = SB(); const c = b.circle(5, 5, 7); b.s.cons.push({ t: 'diameter', e: [c], v: 25 });
  const r = Sketch.solve(b.s); return { ok: r.ok, got: [Sketch.byId(b.s).get(c).r], exp: [12.5] };
}]);
SK.push(['Retta inclinata: lunghezza 30, angolo 30° dall\'orizzontale', () => {
  const b = SB(); const a = b.pt(0, 0), e = b.pt(20, 15); const l = b.line(a, e); const h = b.line(b.pt(0, -5), b.pt(10, -5));
  b.s.cons.push({ t: 'coincident', e: [a, 'O'] }, { t: 'horizontal', e: [h] }, { t: 'len', e: [l], v: 30 }, { t: 'angle', e: [h, l], v: 30 });
  const r = Sketch.solve(b.s); const E = Sketch.byId(b.s); return { ok: r.ok, got: [E.get(e).x, E.get(e).y], exp: [30 * Math.cos(PI / 6), 15] };
}]);

/* ---------- esecuzione ---------- */
function run(tol = TOL) {
  const rel = (g, e, scale) => Math.abs(g - e) / Math.max(Math.abs(e), scale || 1e-9);
  const rows = [];
  for (const c of CASES) {
    const msg = [], errs = {}; let ok = true, mp;
    try {
      const doc = c.build(); const st = Model.regen(doc);
      if (st.errors.size) throw new Error([...st.errors.values()].join('; '));
      if (st.warn.size) msg.push('avviso: ' + [...st.warn.values()].join('; '));
      mp = Model.massProperties(st, doc);
      if (!mp) throw new Error('nessun solido');
      const size = Math.max(...[0, 1, 2].map(i => mp.bbox.mx[i] - mp.bbox.mn[i]));
      const chk = (lab, g, e, scale) => { const r = rel(g, e, scale); if (r > tol) { ok = false; msg.push(`${lab}: ${g.toFixed(3)} invece di ${e.toFixed(3)} (${(r * 100).toFixed(2)}%)`); } return r; };
      if (c.exp.V !== undefined) errs.V = chk('Volume', mp.volume, c.exp.V);
      if (c.exp.R !== undefined) errs.R = chk('Materiale tolto', 40000 - mp.volume, c.exp.R);
      if (c.exp.A !== undefined) errs.A = chk('Area', mp.area, c.exp.A);
      if (c.exp.M !== undefined) errs.M = chk('Massa', mp.mass, c.exp.M);
      if (c.exp.C) errs.C = Math.max(...c.exp.C.map((e, i) => chk('Baricentro ' + 'xyz'[i], mp.centroid[i], e, size)));
      if (c.exp.bb) errs.bb = Math.max(...[0, 1, 2].map(i => Math.max(chk('Ingombro min ' + 'xyz'[i], mp.bbox.mn[i], c.exp.bb[0][i], size), chk('Ingombro max ' + 'xyz'[i], mp.bbox.mx[i], c.exp.bb[1][i], size))));
      rows.push({ name: c.name, ok, errs, msg, V: mp.volume, Vexp: c.exp.V });
    } catch (e) { ok = false; msg.push('ERRORE ' + e.message); rows.push({ name: c.name, ok, errs, msg }); }
  }
  for (const [name, fn] of SK) {
    let ok = true; const msg = [], errs = {};
    try { const r = fn(); if (!r.ok) { ok = false; msg.push('risolutore non converge'); } errs.S = 0; r.exp.forEach((e, i) => { const q = rel(r.got[i], e, 1); errs.S = Math.max(errs.S, q); if (q > tol) { ok = false; msg.push(`valore ${i}: ${r.got[i].toFixed(4)} invece di ${e}`); } }); }
    catch (e) { ok = false; msg.push('ERRORE ' + e.message); }
    rows.push({ name: 'Schizzo · ' + name, ok, errs, msg });
  }
  return rows;
}
if (isNode) {
  const rows = run();
  const pct = x => x === undefined ? '' : (x * 100).toFixed(3) + '%';
  for (const r of rows) console.log((r.ok ? 'OK  ' : 'NO  ') + r.name + (Object.keys(r.errs).length ? '  [' + Object.entries(r.errs).map(([k, v]) => k + ' ' + pct(v)).join(', ') + ']' : '') + (r.msg.length ? '\n      ' + r.msg.join('\n      ') : ''));
  const fail = rows.filter(r => !r.ok).length;
  console.log(`\n${rows.length - fail}/${rows.length} superati (tolleranza ${(TOL * 100).toFixed(1)}%)`);
  if (process.env.JSON) require('fs').writeFileSync(process.env.JSON, JSON.stringify(rows, null, 1));
  process.exit(fail ? 1 : 0);
} else root.SelfTest = { run, count: () => CASES.length + SK.length };
})(this);

    steps: ['Premi **Specchio**.', 'Scegli le funzioni da specchiare (clic su una loro faccia).', 'Scegli il piano di simmetria: frontale, superiore, destro o una faccia piana.', 'Conferma con ✓.'],
    tips: ['Se il pezzo è centrato sull\'origine, i piani standard sono già piani di simmetria.'],
    terms: ['Specchio', 'Piano di simmetria'],
  });
  add('Funzioni', 'piano', 'Piano di riferimento', {
    why: 'Fare schizzi in posizioni dove non c\'è una faccia: a metà pezzo, in alto, sfalsati.',
    cmd: { tab: 'features', id: 'plane' },
    steps: ['Seleziona un piano o una faccia piana, poi premi **Piano di riferimento**.', 'Scrivi la distanza; «Inverti» per l\'altra parte.', 'Conferma: il nuovo piano compare nell\'albero e si può usare per gli schizzi.'],
    terms: ['Piano di riferimento', 'Distanza'],
  });

  /* ================= 4. Albero ================= */
  add('Albero e modifiche', 'modifica', 'Modificare una funzione o uno schizzo', {
    why: 'Il modello è parametrico: cambi una misura e il pezzo si aggiorna.',
    steps: [
      '**Doppio clic** sulla funzione nell\'albero (o su una faccia del pezzo): si riapre il suo pannello.',
      'Per lo schizzo: clic destro sulla funzione › «Modifica schizzo» (o doppio clic sullo schizzo sotto la funzione).',
      'Cambia i valori e conferma: tutte le funzioni dopo vengono ricalcolate ([[Rigenerazione]]).',
      'Se una funzione diventa rossa ha un errore: passa sopra con il puntatore per leggere il motivo.',
    ],
    terms: ['Funzione', 'Rigenerazione', 'Albero di progettazione'],
  });
  add('Albero e modifiche', 'albero-menu', 'Sopprimere, rinominare, eliminare, barra di ripristino', {
    why: 'Organizzare la storia del pezzo.',
    steps: [
      'Clic destro su una funzione nell\'albero apre il menu.',
      '**Sopprimi:** la funzione resta ma non viene calcolata (barrata). Utile per provare varianti.',
      '**Rinomina:** dai nomi chiari (es. «Foro M6 fissaggio»).',
      '**Riporta la barra qui:** la [[Barra di ripristino]] arancione nasconde le funzioni sotto; puoi inserire una funzione nel mezzo. «Riporta la barra alla fine» per tornare.',
      '**Elimina:** toglie la funzione (e quelle che dipendono da lei, dopo una conferma).',
      'Ctrl+Z annulla, Ctrl+Y ripete.',
    ],
    terms: ['Sopprimi', 'Barra di ripristino', 'Annulla / Ripeti'],
  });

  /* ================= 5. Valuta ================= */
  add('Valuta', 'massa', 'Proprietà di massa e materiale', {
    why: 'Conoscere volume, area, massa e baricentro del pezzo.',
    cmd: { tab: 'evaluate', id: 'mass' },
    steps: ['Scheda **Valuta › Materiale**: scegli il materiale (acciaio, alluminio, ottone, plastiche…).', '**Valuta › Proprietà di massa**: compaiono volume, area, massa, baricentro e ingombro.', 'Con «Materiale…» nella stessa finestra cambi il materiale al volo.'],
    tips: ['Senza materiale la massa è calcolata con densità 1 g/cm³.'],
    terms: ['Proprietà di massa', 'Volume', 'Area della superficie', 'Massa', 'Baricentro', 'Materiale', 'Ingombro'],
  });
  add('Valuta', 'misura', 'Misurare', {
    why: 'Controllare distanze, diametri e angoli sul pezzo.',
    cmd: { tab: 'evaluate', id: 'measure' },
    steps: ['Premi **Misura**.', 'Clic su una o due facce, spigoli o vertici.', 'Il risultato compare nel pannello; «Nuova misura» ricomincia.'],
    terms: ['Misura', 'Faccia', 'Spigolo', 'Vertice'],
  });
  add('Valuta', 'sezione', 'Vista in sezione (nel modello 3D)', {
    why: 'Vedere l\'interno del pezzo senza modificarlo.',
    cmd: { tab: 'evaluate', id: 'section' },
    steps: ['Premi **Vista in sezione** (anche dalla barretta della vista).', 'In basso scegli il piano e sposta il cursore per muovere il taglio; «Inverti» cambia la parte tolta.', '«Chiudi» toglie la sezione.'],
    terms: ['Vista in sezione'],
  });
  add('Valuta', 'autoverifica', 'Autoverifica del programma', {
    why: 'Controllare che i calcoli del programma siano giusti.',
    cmd: { tab: 'evaluate', id: 'selftest' },
    steps: ['Premi **Autoverifica**.', 'Il programma ricostruisce i pezzi di prova e confronta volume, area, baricentro e ingombro con i valori calcolati a mano.', 'La tabella mostra per ogni prova l\'errore più grande (ammesso fino all\'1 %).'],
    terms: ['Autoverifica'],
  });

  /* ================= 6. Messa in tavola ================= */
  add('Messa in tavola', 'tavola', 'Fare la tavola del pezzo', {
    why: 'Il disegno tecnico quotato da consegnare o stampare.',
    cmd: { tab: 'drawing', id: 'dAuto' },
    steps: [
      'Apri la scheda **Messa in tavola**: compaiono le viste in [[Metodo E]].',
      'A sinistra scegli il [[Foglio]] (A4, A3…) e la [[Scala]] (Automatica sceglie quella unificata più grande che sta nel foglio).',
      'Spunta le viste che servono (dall\'alto, da sinistra… e l\'assonometria) e le [[Linee nascoste]].',
      'Trascina le viste per sistemarle: quelle proiettate restano allineate alla frontale.',
      'Compila il [[Cartiglio]] (titolo, autore, classe, numero del disegno).',
      '**Adatta il foglio** fa entrare tutta la tavola nella finestra; Ctrl + rotella ingrandisce o rimpicciolisce il foglio.',
    ],
    terms: ['Messa in tavola', 'Metodo E', 'Proiezioni ortogonali', 'Foglio', 'Scala', 'Linee nascoste', 'Assi', 'Cartiglio'],
  });
  add('Messa in tavola', 'quote-tavola', 'Quotare la tavola', {
    why: 'Mettere le misure secondo le regole del disegno tecnico.',
    cmd: { tab: 'drawing', id: 'dDim' },
    steps: [
      '**Quote di ingombro:** aggiunge in un colpo le dimensioni massime e i diametri dei cerchi.',
      '**Quota:** clic su uno spigolo (lunghezza), su un cerchio (diametro) o su due punti della stessa vista, poi clic dove mettere la quota.',
      'Le quote si trascinano per sistemarle; l\'elenco «Quote» a sinistra permette di eliminarle.',
    ],
    tips: ['Le quote vanno sulle viste ortogonali, non sull\'assonometria.'],
    terms: ['Quote di ingombro', 'Tolleranze generali'],
  });
  add('Messa in tavola', 'sezione-tavola', 'Vista in sezione nella tavola', {
    why: 'Mostrare l\'interno del pezzo con il tratteggio.',
    cmd: { tab: 'drawing', id: 'dSection' },
    steps: ['Premi **Vista in sezione** (scheda Messa in tavola).', 'Scegli la vista da sezionare, la posizione del piano di taglio e la lettera (A).', '«Applica»: la vista diventa la sezione A-A tratteggiata e la traccia del piano compare nella vista vicina.'],
    terms: ['Sezione'],
  });
  add('Messa in tavola', 'stampa', 'Stampare ed esportare la tavola', {
    why: 'Consegnare il disegno su carta o in file.',
    cmd: { tab: 'drawing', id: 'dPrint' },
    steps: ['**Stampa / PDF:** nella finestra di stampa scegli «Dimensioni effettive» o «100 %» per avere la scala giusta, oppure «Salva come PDF».', '**Esporta SVG:** disegno vettoriale in scala 1:1.', '**Esporta DXF:** per AutoCAD e gli altri CAD 2D, con livelli e tipi di linea.'],
    terms: ['Esporta SVG', 'Esporta DXF', 'Scala'],
  });

  /* ================= 7. Esercitazioni ================= */
  add('Esercitazioni', 'esercizi', 'Fare un\'esercitazione e verificarla', {
    why: 'Esercitarsi su pezzi meccanici con controllo automatico.',
    cmd: { tab: 'lessons', id: 'lList' },
    steps: [
      'Apri la scheda **Esercitazioni** e scegli un esercizio dall\'elenco.',
      'Leggi l\'obiettivo e guarda la tavola di consegna (clic per ingrandirla).',
      '«Nuova parte» comincia da una parte vuota; segui i passi suggeriti.',
      '«Verifica il modello» confronta il tuo pezzo con quello richiesto: ingombro, volume, area, schizzi definiti (e materiale se richiesto).',
    ],
    tips: ['Una verifica verde con tutti gli schizzi neri è il risultato da consegnare.'],
    terms: ['Ingombro', 'Volume', 'Completamente definito'],
  });

  /* ---------------- testo ---------------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function rich(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, term, label) => `<button type="button" class="gd-term" data-term="${term}">${label || term}</button>`);
  }
  const plain = t => (t.t + ' ' + t.why + ' ' + (t.steps || []).join(' ') + ' ' + (t.tips || []).join(' ') + ' ' + (t.terms || []).join(' ')).replace(/\*\*|\[\[|\]\]/g, '').toLowerCase();

  /* ---------------- «Mostrami dove» ---------------- */
  function showMe(cmd) {
    const App = window.App;
    if (!cmd) return;
    App.setCmdTab(cmd.tab);
    setTimeout(() => {
      const b = document.querySelector(`#cmdBar [data-cmd="${cmd.id}"]`);
      if (!b) return;
      b.scrollIntoView({ block: 'nearest', inline: 'center' });
      b.classList.remove('gd-flash'); void b.offsetWidth; b.classList.add('gd-flash');
      setTimeout(() => b.classList.remove('gd-flash'), 2600);
    }, 60);
  }

  /* ---------------- pannello ---------------- */
  let current = null, query = '';
  function open(id) {
    const App = window.App;
    const right = document.querySelector('#right');
    right.hidden = false; App.rightPanel = 'guide';
    if (id !== undefined) current = id;
    render();
    App.redraw && App.redraw();
  }
  function render() {
    const body = document.querySelector('#rightBody');
    document.querySelector('#rightTitle').textContent = 'Guida';
    body.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className = 'gd';
    body.append(wrap);
    const topic = current && T.find(t => t.id === current);
    if (topic) {
      const i = T.indexOf(topic), prev = T[i - 1], next = T[i + 1];
      wrap.innerHTML = `
        <button type="button" class="gd-back">← Tutti gli argomenti</button>
        <div class="gd-cap">${esc(topic.cap)}</div>
        <h3 class="gd-title">${esc(topic.t)}</h3>
        <p class="gd-why">${rich(topic.why)}</p>
        ${topic.cmd ? '<button type="button" class="btn btn-small gd-show">Mostrami dove</button>' : ''}
        <h4>Come si fa</h4>
        <ol class="gd-steps">${topic.steps.map(s => `<li>${rich(s)}</li>`).join('')}</ol>
        ${topic.tips && topic.tips.length ? `<h4>Consigli</h4><ul class="gd-tips">${topic.tips.map(s => `<li>${rich(s)}</li>`).join('')}</ul>` : ''}
        ${topic.terms && topic.terms.length ? `<h4>Termini</h4><div class="gd-chips">${topic.terms.map(t => `<button type="button" class="gd-term gd-chip" data-term="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
        <div class="gd-nav">${prev ? `<button type="button" class="relbtn" data-go="${prev.id}">← ${esc(prev.t)}</button>` : '<span></span>'}${next ? `<button type="button" class="relbtn" data-go="${next.id}">${esc(next.t)} →</button>` : ''}</div>`;
      wrap.querySelector('.gd-back').addEventListener('click', () => { current = null; render(); });
      const sh = wrap.querySelector('.gd-show'); if (sh) sh.addEventListener('click', () => showMe(topic.cmd));
      wrap.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { current = b.dataset.go; render(); document.querySelector('#rightBody').scrollTop = 0; }));
    } else {
      wrap.innerHTML = `<p class="note">Come si usa ogni comando: a cosa serve, i passi da seguire, i consigli e il significato dei termini (i termini sottolineati aprono la spiegazione).</p>
        <input type="search" class="gl-search gd-search" placeholder="Cerca (es. foro, quota, sweep, tablet)" aria-label="Cerca nella guida">
        <div class="gd-list"></div>`;
      const q = wrap.querySelector('.gd-search'); q.value = query;
      const list = wrap.querySelector('.gd-list');
      const draw = () => {
        query = q.value; const s = query.trim().toLowerCase();
        list.innerHTML = '';
        let last = null, n = 0;
        for (const t of T) {
          if (s && !plain(t).includes(s)) continue;
          if (t.cap !== last) { const h = document.createElement('h3'); h.className = 'gl-h'; h.textContent = t.cap; list.append(h); last = t.cap; }
          const b = document.createElement('button'); b.type = 'button'; b.className = 'gd-item';
          b.innerHTML = `<span class="gd-it">${esc(t.t)}</span><span class="gd-iw">${esc(t.why)}</span>`;
          b.addEventListener('click', () => { current = t.id; render(); document.querySelector('#rightBody').scrollTop = 0; });
          list.append(b); n++;
        }
        if (!n) list.innerHTML = '<p class="note">Nessun argomento trovato. Prova anche nel Glossario.</p>';
      };
      q.addEventListener('input', draw);
      draw();
    }
    // termini: spiegazione del glossario
    wrap.querySelectorAll('.gd-term').forEach(b => b.addEventListener('click', ev => { ev.preventDefault(); if (window.Glossary) window.Glossary.popFor(b.dataset.term, b); }));
  }
  // argomento della guida per un termine del glossario (per il collegamento «Come si fa»)
  function topicFor(term) {
    const n = String(term || '').toLowerCase();
    return T.find(t => t.t.toLowerCase() === n) || T.find(t => (t.terms || [])[0] && t.terms[0].toLowerCase() === n) || T.find(t => (t.terms || []).some(x => x.toLowerCase() === n) && t.cmd);
  }

  function init() {
    const App = window.App;
    const tools = document.querySelector('.top .tools');
    if (tools && !document.querySelector('#btnGuide')) {
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.id = 'btnGuide'; b.type = 'button'; b.title = 'Come si usano i comandi, passo per passo'; b.setAttribute('aria-label', 'Guida');
      b.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.7-2.5 2-2.5 3.8M12 16.8v.2"/></svg><span class="gl-btn-t">Guida</span>';
      b.addEventListener('click', () => { if (App.rightPanel === 'guide' && !document.querySelector('#right').hidden) { document.querySelector('#right').hidden = true; App.rightPanel = null; App.redraw && App.redraw(); } else open(); });
      const gl = document.querySelector('#btnGloss');
      tools.insertBefore(b, gl || tools.querySelector('.menu-wrap'));
    }
    // «Progetto › Guida rapida» apre la guida completa
    if (App) App.help = () => open(null);
  }
  window.Guide = { topics: T, open, topicFor, showMe };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(init, 0)); else setTimeout(init, 0);
})();
</script>
