<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Banco CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Banco CAD — banco di modellazione: neutri freddi da sala disegno, accento blu cobalto per la selezione,
   ambra per l'evidenziazione e le anteprime (come nei CAD). */
:root {
  --bg: #e9ecef;
  --panel: #f7f8f9;
  --panel-2: #eef1f3;
  --line: #d3d8dd;
  --line-2: #bfc6cd;
  --ink: #1c232b;
  --ink-2: #4b5662;
  --ink-3: #7a8591;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --accent-soft: #dce8f8;
  --amber: #c27a06;
  --amber-soft: #fbefd7;
  --ok: #1d7a43;
  --ok-soft: #dcf1e4;
  --err: #b42318;
  --err-soft: #fbe3e1;
  --view-top: #f2f4f6;
  --view-bot: #d9dee3;
  --sheet-bg: #c9ced3;
  --shadow: 0 6px 20px rgba(20, 30, 40, .14);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-c: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191e; --panel: #1c2228; --panel-2: #232a31; --line: #2e363f; --line-2: #3a434d;
    --ink: #e4e8ec; --ink-2: #b2bbc4; --ink-3: #85909b;
    --accent: #5b9bf0; --accent-ink: #0b1420; --accent-soft: #1d2d44;
    --amber: #f0ad3a; --amber-soft: #3a2c12; --ok: #5cc98a; --ok-soft: #173325; --err: #f2867b; --err-soft: #3d1c19;
    --view-top: #2a3138; --view-bot: #1a1f24; --sheet-bg: #2a3036;
    --shadow: 0 6px 22px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191e; --panel: #1c2228; --panel-2: #232a31; --line: #2e363f; --line-2: #3a434d;
  --ink: #e4e8ec; --ink-2: #b2bbc4; --ink-3: #85909b;
  --accent: #5b9bf0; --accent-ink: #0b1420; --accent-soft: #1d2d44;
  --amber: #f0ad3a; --amber-soft: #3a2c12; --ok: #5cc98a; --ok-soft: #173325; --err: #f2867b; --err-soft: #3d1c19;
  --view-top: #2a3138; --view-bot: #1a1f24; --sheet-bg: #2a3036;
  --shadow: 0 6px 22px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }

/* ---------- testata ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--accent); flex: none; }
.brand-name { font: 600 16px/1 var(--font-c); color: var(--ink); letter-spacing: .02em; }
.docname { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 8px; font-weight: 500; min-width: 0; width: 220px; }
.docname:hover { border-color: var(--line); }
.docname:focus { border-color: var(--accent); background: var(--panel-2); outline: none; }
.top .tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.icon-btn { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--panel-2); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { border-color: var(--line); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn-danger { color: var(--err); }
.btn-small { padding: 4px 9px; font-size: 13px; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 220px; display: flex; flex-direction: column; }
.menu button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 5px; cursor: pointer; }
.menu button:hover { background: var(--accent-soft); }

/* ---------- CommandManager ---------- */
.cmd { background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.cmd-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.cmd-tabs button { border: 0; background: transparent; padding: 7px 14px 6px; cursor: pointer; font: 500 13px/1 var(--font); color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.cmd-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.cmd-tabs button:hover { color: var(--ink); }
.cmd-bar { display: flex; flex-wrap: wrap; align-items: stretch; gap: 2px; padding: 4px 8px; min-height: 58px; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; max-width: 86px; padding: 5px 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; font: 500 11.5px/1.15 var(--font-c); color: var(--ink); text-align: center; flex: none; }
.tool svg { width: 24px; height: 24px; color: var(--ink-2); }
.tool:hover { background: var(--panel-2); border-color: var(--line); }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tool[aria-pressed="true"] svg { color: var(--accent); }
.tool:disabled { opacity: .38; cursor: default; background: transparent; border-color: transparent; }
.tool-sep { width: 1px; background: var(--line); margin: 4px 4px; flex: none; }
.tool-small { flex-direction: row; min-width: 0; max-width: none; gap: 6px; padding: 5px 9px; font-size: 12.5px; }
.tool-small svg { width: 18px; height: 18px; }

/* ---------- area principale ---------- */
.main { display: flex; min-height: 0; min-width: 0; position: relative; }
.left { width: 290px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tree { overflow: auto; padding: 8px 6px 16px; flex: 1; min-height: 0; }
.pm { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; position: relative; min-width: 0; background: linear-gradient(var(--view-top), var(--view-bot)); touch-action: none; overflow: hidden; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
.right { width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.right-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 6px 14px; border-bottom: 1px solid var(--line); }
.right-head h2 { margin: 0; font: 600 15px/1.2 var(--font-c); letter-spacing: .02em; }
.right-body { overflow: auto; padding: 12px 14px 24px; min-height: 0; flex: 1; }

/* albero */
.tnode { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px; cursor: pointer; user-select: none; white-space: nowrap; min-width: 0; }
.tnode:hover { background: var(--panel-2); }
.tnode.sel { background: var(--accent-soft); }
.tnode .ti { width: 18px; height: 18px; flex: none; color: var(--ink-2); }
.tnode .tl { overflow: hidden; text-overflow: ellipsis; }
.tnode.sup .tl { color: var(--ink-3); text-decoration: line-through; }
.tnode.err .tl { color: var(--err); }
.tnode .badge { margin-left: auto; font-size: 11px; padding: 0 5px; border-radius: 8px; }
.tnode .badge.err { background: var(--err-soft); color: var(--err); }
.tnode .badge.warn { background: var(--amber-soft); color: var(--amber); }
.tnode .tg { width: 14px; flex: none; color: var(--ink-3); font-size: 10px; text-align: center; }
.tchild { padding-left: 18px; }
.rollback { height: 0; border-top: 3px solid var(--amber); margin: 4px 6px; position: relative; }
.rollback::after { content: "Barra di ripristino"; position: absolute; right: 0; top: -9px; font-size: 10px; color: var(--amber); background: var(--panel); padding: 0 4px; }
.tree .rollback-after { opacity: .5; }

/* PropertyManager */
.pm-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.pm-head h2 { margin: 0; font: 600 15px/1.2 var(--font-c); flex: 1; min-width: 0; }
.pm-ok, .pm-no { width: 32px; height: 30px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; cursor: pointer; background: var(--panel); }
.pm-ok { color: var(--ok); }
.pm-no { color: var(--err); }
.pm-ok:hover { background: var(--ok-soft); }
.pm-no:hover { background: var(--err-soft); }
.pm-ok:disabled { opacity: .4; cursor: default; background: var(--panel); }
.pm-body { padding: 10px 12px 18px; display: flex; flex-direction: column; gap: 12px; }
.grp { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
.grp > h3 { margin: 0; font: 600 12px/1.2 var(--font-c); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row > label, .row > .lab { flex: 1; min-width: 0; color: var(--ink-2); font-size: 13px; }
.row input[type="text"], .row input[type="number"], .row select { width: 120px; flex: none; padding: 5px 7px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); font-family: var(--mono); font-size: 13px; }
.row select { font-family: var(--font); }
.row input:focus, .row select:focus { outline: none; border-color: var(--accent); }
.unit { font: 12px var(--mono); color: var(--ink-3); width: 22px; flex: none; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.selbox { min-height: 34px; border: 1px dashed var(--line-2); border-radius: 6px; padding: 5px 7px; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; cursor: pointer; background: var(--panel-2); }
.selbox.active { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.selbox .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; display: inline-flex; gap: 4px; align-items: center; }
.selbox .chip button { border: 0; background: transparent; padding: 0 0 0 2px; cursor: pointer; color: var(--ink-3); line-height: 1; }
.selbox .empty { color: var(--ink-3); }
.note { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.note.err { color: var(--err); }
.note.ok { color: var(--ok); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.relbtn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.relbtn:hover { background: var(--accent-soft); border-color: var(--accent); }
.rellist { display: flex; flex-direction: column; gap: 3px; }
.rellist .ri { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 6px; border-radius: 5px; background: var(--panel-2); }
.rellist .ri button { margin-left: auto; border: 0; background: transparent; cursor: pointer; color: var(--err); font-size: 12px; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel); padding: 5px 4px; font-size: 12.5px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* HUD e angolo di conferma */
.hud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; background: color-mix(in srgb, var(--panel) 88%, transparent); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); z-index: 5; }
.hud-btn { width: 32px; height: 30px; border: 0; background: transparent; border-radius: 5px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.hud-btn:hover, .hud-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.hud-group { position: relative; }
.hud-menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-width: 230px; z-index: 30; }
#styleMenu { grid-template-columns: 1fr; min-width: 220px; }
.hud-menu button { border: 0; background: transparent; text-align: left; padding: 7px 9px; border-radius: 5px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.hud-menu button:hover, .hud-menu button[aria-pressed="true"] { background: var(--accent-soft); }
.corner { position: absolute; top: 8px; right: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 6; }
.corner button { width: 40px; height: 36px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .1); }
.corner-ok { color: var(--ok); }
.corner-no { color: var(--err); }
.corner-ok:hover { background: var(--ok-soft); }
.corner-no:hover { background: var(--err-soft); }
.modify { position: absolute; z-index: 20; display: flex; align-items: center; gap: 3px; background: var(--panel); border: 1px solid var(--accent); border-radius: 7px; padding: 3px; box-shadow: var(--shadow); }
.modify input { width: 96px; border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 6px; font: 14px var(--mono); background: var(--panel); }
.modify input:focus { outline: none; border-color: var(--accent); }
.modify button { width: 28px; height: 28px; border: 0; border-radius: 5px; display: grid; place-items: center; cursor: pointer; background: transparent; }
.mod-ok { color: var(--ok); } .mod-no { color: var(--err); }
.mod-ok:hover { background: var(--ok-soft); } .mod-no:hover { background: var(--err-soft); }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 12px; border-radius: 7px; font-size: 13px; max-width: min(560px, 90%); text-align: center; pointer-events: none; z-index: 7; }
.secbar { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; z-index: 6; font-size: 13px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.secbar input[type="range"] { width: 160px; }

/* stato */
.status { display: flex; align-items: center; gap: 16px; padding: 3px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); min-width: 0; white-space: nowrap; }
.st-msg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.st-def { font-weight: 600; padding: 1px 8px; border-radius: 8px; }
.st-def.under { color: #1f4fd8; background: #e1e9fb; }
.st-def.full { color: var(--ink); background: var(--panel-2); }
.st-def.over { color: var(--err); background: var(--err-soft); }
.st-xy { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.st-units { font-family: var(--mono); color: var(--ink-3); }

/* messa in tavola */
.sheetview { flex: 1; min-width: 0; background: var(--sheet-bg); position: relative; display: flex; }
.sheet-scroll { flex: 1; overflow: auto; padding: 18px; }
.sheet-holder { margin: 0 auto; width: max-content; box-shadow: 0 4px 18px rgba(0, 0, 0, .25); background: #fff; touch-action: none; }
.sheet-holder svg { display: block; }

/* menu contestuale, finestre, avvisi */
.ctx { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; display: flex; flex-direction: column; }
.ctx button { text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.ctx button:hover { background: var(--accent-soft); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(10, 16, 22, .45); display: grid; place-items: center; padding: 16px; }
.modal-card { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; overflow: hidden; }
.modal-card h2 { margin: 0; padding: 16px 18px 6px; font: 600 18px/1.25 var(--font-c); }
.modal-body { padding: 6px 18px 12px; overflow: auto; font-size: 14px; }
.modal-body textarea { width: 100%; box-sizing: border-box; height: 180px; font: 12px var(--mono); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px; background: var(--panel-2); resize: vertical; }
.modal-body ul { padding-left: 18px; margin: 6px 0; }
.modal-body li { margin: 4px 0; }
.modal-body kbd { font: 12px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); max-width: 90vw; }



/* autoverifica */
.st-wrap { max-height: 56vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.st-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.st-table th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.st-table td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.st-table td:first-child { color: var(--ok); width: 18px; }
.st-table .st-no td:first-child, .st-table .st-no { color: var(--err); }
.st-table td.num { font-family: var(--mono); }
.st-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-msg { font-size: 12px; color: var(--ink-3); margin-top: 2px; }


/* tablet: pezzo «preso» per ruotare e spostare */
.view.grab::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); pointer-events: none; z-index: 4; }
.grab-badge { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 4px 6px 4px 14px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; }
.grab-badge .btn { background: var(--panel); color: var(--ink); border-color: transparent; border-radius: 14px; }


/* guida «Come si fa» */
#btnGuide { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 640px) { #btnGuide .gl-btn-t { display: none; } #btnGuide { padding: 6px 8px; } }
.gd { display: flex; flex-direction: column; gap: 8px; }
.gd-item { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.gd-item:hover { border-color: var(--accent); }
.gd-it { font-weight: 600; }
.gd-iw { font-size: 12.5px; color: var(--ink-3); }
.gd-list { display: flex; flex-direction: column; gap: 6px; }
.gd-back { align-self: flex-start; border: 0; background: transparent; color: var(--accent); padding: 0; cursor: pointer; font-size: 13px; }
.gd-cap { font: 600 11px/1.2 var(--font-c); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-top: 4px; }

<script>
/* CSG con alberi BSP (algoritmo di csg.js, E. Wallace) riscritto senza ricorsione profonda.
   Ogni poligono porta un "tag": l'indice della superficie da cui nasce (piano, cilindro, cono, toro...).
   I tag servono per il calcolo esatto delle proprietà di massa, per gli spigoli e per la messa in tavola. */
(function (root) {
  'use strict';
  const EPS = 1e-6;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = a => Math.sqrt(dot(a, a));
  const norm = a => { const l = len(a); return l > 0 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; };
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  // piano dal poligono: normale di Newell (robusta anche con vertici quasi allineati)
  function planeOf(vs) {
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < vs.length; i++) {
      const a = vs[i], b = vs[(i + 1) % vs.length];
      nx += (a[1] - b[1]) * (a[2] + b[2]);
      ny += (a[2] - b[2]) * (a[0] + b[0]);
      nz += (a[0] - b[0]) * (a[1] + b[1]);
    }
    const n = norm([nx, ny, nz]);
    let cx = 0, cy = 0, cz = 0;
    for (const v of vs) { cx += v[0]; cy += v[1]; cz += v[2]; }
    const c = [cx / vs.length, cy / vs.length, cz / vs.length];
    return { n, w: dot(n, c) };
  }
  function poly(vs, tag) { return { v: vs, p: planeOf(vs), t: tag }; }
  function flipPoly(p) { return { v: p.v.slice().reverse(), p: { n: mul(p.p.n, -1), w: -p.p.w }, t: p.t }; }

  const COPLANAR = 0, FRONT = 1, BACK = 2, SPANNING = 3;
  function splitPolygon(pl, polygon, coFront, coBack, front, back) {
    let ptype = 0;
    const types = new Array(polygon.v.length);
    for (let i = 0; i < polygon.v.length; i++) {
      const t = dot(pl.n, polygon.v[i]) - pl.w;
      const type = t < -EPS ? BACK : t > EPS ? FRONT : COPLANAR;
      ptype |= type; types[i] = type;
    }
    switch (ptype) {
      case COPLANAR: (dot(pl.n, polygon.p.n) > 0 ? coFront : coBack).push(polygon); break;
      case FRONT: front.push(polygon); break;
      case BACK: back.push(polygon); break;
      default: {
        const f = [], b = [];
        const n = polygon.v.length;
        for (let i = 0; i < n; i++) {
          const j = (i + 1) % n;
          const ti = types[i], tj = types[j], vi = polygon.v[i], vj = polygon.v[j];
          if (ti !== BACK) f.push(vi);
          if (ti !== FRONT) b.push(vi);
          if ((ti | tj) === SPANNING) {
            const t = (pl.w - dot(pl.n, vi)) / dot(pl.n, sub(vj, vi));
            const v = lerp(vi, vj, t);
            f.push(v); b.push(v.slice());
          }
        }
        if (f.length >= 3) front.push({ v: f, p: polygon.p, t: polygon.t });
        if (b.length >= 3) back.push({ v: b, p: polygon.p, t: polygon.t });
      }
    }
  }

  // nodo BSP
  function Node() { this.plane = null; this.front = null; this.back = null; this.polygons = []; }
  function choosePlane(polys) {
    // sceglie, tra alcuni candidati, il piano che taglia meno poligoni
    if (polys.length < 8) return polys[0].p;
    let best = null, bestScore = Infinity;
    const step = Math.max(1, Math.floor(polys.length / 7));
    for (let k = 0; k < polys.length && k < 7 * step; k += step) {
      const pl = polys[k].p;
      let sp = 0, fr = 0, bk = 0;
      const sample = Math.max(1, Math.floor(polys.length / 60));
      for (let i = 0; i < polys.length; i += sample) {
        let ptype = 0;
        for (const v of polys[i].v) { const t = dot(pl.n, v) - pl.w; ptype |= t < -EPS ? BACK : t > EPS ? FRONT : COPLANAR; }
        if (ptype === SPANNING) sp++; else if (ptype === FRONT) fr++; else if (ptype === BACK) bk++;
      }
      const score = sp * 8 + Math.abs(fr - bk);
      if (score < bestScore) { bestScore = score; best = pl; }
    }
    return best;
  }
  Node.prototype.build = function (polygons) {
    const stack = [[this, polygons]];
    while (stack.length) {
      const [node, polys] = stack.pop();
      if (!polys.length) continue;
      if (!node.plane) node.plane = choosePlane(polys);
      const front = [], back = [];
      for (const p of polys) splitPolygon(node.plane, p, node.polygons, node.polygons, front, back);
      if (front.length) { if (!node.front) node.front = new Node(); stack.push([node.front, front]); }
      if (back.length) { if (!node.back) node.back = new Node(); stack.push([node.back, back]); }
    }
  };
  Node.prototype.invert = function () {
    const stack = [this];
    while (stack.length) {

    for (const t of tl) {
      const n = t.pts.length;
      t.top = t.pts.map((P, i) => {
        const n1 = leftN(t, (i - 1 + n) % n, P), n2 = leftN(t, i, P);
        const k = 1 + n1[0] * n2[0] + n1[1] * n2[1];

          } else {
            const ccw = (t.pts[i][0] - s.c[0]) * (t.pts[j][1] - t.pts[i][1]) - (t.pts[i][1] - s.c[1]) * (t.pts[j][0] - t.pts[i][0]) > 0;

  /* ---------------- rivoluzione ---------------- */
  // asse nel piano di schizzo: punti A, B (2D). Il profilo deve stare da una parte dell'asse.
  function revolve(region, F, A2, B2, angle, tags, base, startAngle = 0) {
    const A = to3(F, A2), B = to3(F, B2);

    const loops = [region.outer, ...region.holes];
    const tl = loops.map(tessLoop);
    // coordinate (r, z) di ogni punto del profilo

    // direzione radiale di riferimento (il lato del profilo)

    for (const t of tl) for (const p of t.pts) { const [r, , rv] = toRZ(p); if (r > 1e-9) { refDir = norm(rv); break; } if (refDir) break; }
    if (!refDir) throw new Error('profilo sull\'asse');

    const ang = Math.abs(angle);
    const rot = (r, z, th) => { const c = Math.cos(th), s = Math.sin(th); return add(A, add(mul(d, z), add(mul(e1, r * c), mul(e2, r * s)))); };
    let maxR = 0;
    for (const t of tl) for (const p of t.pts) maxR = Math.max(maxR, toRZ(p)[0]);
    const N = segsFor(maxR, ang);
    const th = i => sgn * (startAngle + ang * i / N);
    const polys = [];
    const tagCache = new Map();
    const tagFor = (s, rz0, rz1) => {
      if (tagCache.has(s)) return tagCache.get(s);
      let tg;
      if (s.type === 'line') {
        const [r0, z0] = rz0, [r1, z1] = rz1;
        if (Math.abs(z1 - z0) < 1e-9) tg = { kind: 'plane', n: null, w: 0 };

        const p = t.pts[i], q = t.pts[(i + 1) % n];
        const rzp = toRZ(p), rzq = toRZ(q);
        const tg = s.type === 'line' ? tagFor(s, toRZ(s.a), toRZ(s.b)) : tagFor(s);

        for (let k = 0; k < N; k++) {

    }

  }

  /* ---------------- cilindro / foro ---------------- */
  // profilo di foro nel piano (r, z): z da 0 (sulla faccia) verso il basso (positivo = dentro il pezzo)
  // segmenti: [{r0,z0,r1,z1}] dal bordo esterno all'asse
  function holeTool(o, dir, profile, tags, base) {
    // costruisce un solido di rivoluzione con asse o + t*dir; il profilo va dall'asse (r=0, z = -sopra) al fondo
    // si usa revolve con un riferimento costruito sul momento

    const y = cross(d, x);
    // piano di schizzo contenente l'asse: asse = direzione "y" del riferimento 2D
    const F = { o, x, y: d, z: cross(x, d) };
    const pts = profile; // [[r, z], ...] chiuso, con r >= 0
    let id = 0;
    const loop = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      loop.push({ type: 'line', a: [a[0], a[1]], b: [b[0], b[1]], id: 'h' + (id++) });
    }
    return revolve({ outer: loop, holes: [] }, F, [0, 0], [0, 1], TAU, tags, base);
  }

  /* ---------------- topologia: spigoli tra superfici diverse ---------------- */
  function surfKey(tg) {
    if (!tg) return 'x';
    const q = v => Math.round(v * 1e5) / 1e5;
    if (tg.kind === 'plane') return 'P' + tg.n.map(x => q(x)).join(',') + '|' + q(tg.w);
    // asse canonico
    let d = tg.d;
    const s = (Math.abs(d[0]) > 1e-9 ? d[0] : Math.abs(d[1]) > 1e-9 ? d[1] : d[2]) < 0 ? -1 : 1;
    d = mul(d, s);
    const o = sub(tg.o, mul(d, dot(tg.o, d)));
    const off = dot(tg.o, d); // coordinata z dell'origine dell'asse sulla retta canonica
    const pr = tg.prof;
    let ps;
    if (pr.pt === 'line') {
      // retta nel piano r-z: forma canonica
      const z0 = pr.z0 * s + off, z1 = pr.z1 * s + off;
      if (Math.abs(pr.r1 - pr.r0) < 1e-9) ps = 'C' + q(pr.r0);
      else { const k = (pr.r1 - pr.r0) / (z1 - z0); ps = 'K' + q(k) + ',' + q(pr.r0 - k * z0); }
    } else ps = 'A' + q(pr.rc) + ',' + q(pr.zc * s + off) + ',' + q(pr.a);
    return 'R' + d.map(q).join(',') + '|' + o.map(q).join(',') + '|' + ps;
  }

  // unisce i vertici vicini e spezza i lati che hanno vertici a T
  function topology(polys, tags) {
    const keyOf = p => Math.round(p[0] * 1e5) + ',' + Math.round(p[1] * 1e5) + ',' + Math.round(p[2] * 1e5);
    const verts = [], vmap = new Map();
    const vid = p => {
      const k = keyOf(p);
      let i = vmap.get(k);
      if (i === undefined) {
        // controlla le celle vicine per la tolleranza
        const bx = Math.round(p[0] * 1e5), by = Math.round(p[1] * 1e5), bz = Math.round(p[2] * 1e5);
        for (let dx = -1; dx <= 1 && i === undefined; dx++) for (let dy = -1; dy <= 1 && i === undefined; dy++) for (let dz = -1; dz <= 1 && i === undefined; dz++) {

    const size = Math.max(bb.mx[0] - bb.mn[0], bb.mx[1] - bb.mn[1], bb.mx[2] - bb.mn[2], 1e-6);
    const cell = size / 48;
    const grid = new Map();
    const ck = (x, y, z) => x + ',' + y + ',' + z;
    const cOf = v => [Math.floor((v[0] - bb.mn[0]) / cell), Math.floor((v[1] - bb.mn[1]) / cell), Math.floor((v[2] - bb.mn[2]) / cell)];
    verts.forEach((v, i) => { const c = cOf(v); const k = ck(c[0], c[1], c[2]); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i); });

    const segCache = new Map();

    for (const [k, list] of edges) {
      const [i, j] = k.split(',').map(Number);
      const sk = new Set(list.map(e => keys[polys[e.poly].t]));
      const e = { a: i, b: j, polys: list.map(x => x.poly), uses: list, tags: [...new Set(list.map(x => polys[x.poly].t))] };
      e.sharp = sk.size > 1 || list.length < 2;
      out.push(e);
    }
    return { verts, polyVerts: P, edges: out, surfKeys: keys };
  }

  /* ---------------- proprietà di massa (esatte sulle superfici di rivoluzione) ---------------- */
  // regola di quadratura su triangolo (Dunavant, grado 5, 7 punti)
  const QW = [0.225, 0.132394152788506, 0.132394152788506, 0.132394152788506, 0.125939180544827, 0.125939180544827, 0.125939180544827];
  const QP = [[1 / 3, 1 / 3], [0.059715871789770, 0.470142064105115], [0.470142064105115, 0.059715871789770], [0.470142064105115, 0.470142064105115],
    [0.797426985353087, 0.101286507323456], [0.101286507323456, 0.797426985353087], [0.101286507323456, 0.101286507323456]];
  function rhoTrue(pr, z) {

  function dRho(pr, z) {

    return null;
  }
  // integrando della correzione in un punto x della faccetta (normale n):

  }

  // jacobiano numerico (differenze centrali)
  function jacobian(sk, V) {
    const r0 = []; residuals(sk, V.E, r0);
    const m = r0.length, n = V.vars.length;
    const J = []; for (let i = 0; i < m; i++) J.push(new Array(n).fill(0));
    for (let j = 0; j < n; j++) {
      const [e, k] = V.vars[j];
      const x0 = e[k];
      const h = 1e-7 * Math.max(1, Math.abs(x0));
      e[k] = x0 + h; const rp = []; residuals(sk, V.E, rp);
      e[k] = x0 - h; const rm = []; residuals(sk, V.E, rm);
      e[k] = x0;
      for (let i = 0; i < m; i++) J[i][j] = (rp[i] - rm[i]) / (2 * h);
    }
    return { J, r: r0 };
  }

  // passo di Newton a norma minima: dx = -Jt (J Jt + mu I)^-1 r
  function newtonStep(J, r, mu) {
    const m = r.length, n = J[0] ? J[0].length : 0;
    const A = [];
    for (let i = 0; i < m; i++) {
      const row = new Array(m).fill(0);
      for (let k = 0; k < m; k++) { let s = 0; for (let j = 0; j < n; j++) s += J[i][j] * J[k][j]; row[k] = s; }
      row[i] += mu;
      A.push(row);
    }
    const y = solveLin(A, r.map(x => -x));
    if (!y) return null;
    const dx = new Array(n).fill(0);
    for (let j = 0; j < n; j++) { let s = 0; for (let i = 0; i < m; i++) s += J[i][j] * y[i]; dx[j] = s; }
    return dx;
  }

  function norm2(r) { let s = 0; for (const x of r) s += x * x; return Math.sqrt(s); }

  // risolve lo schizzo; drag = {id, x, y} (punto trascinato) oppure {id, r} (cerchio)
  function solve(sk, opts = {}) {
    normalizeArcs(sk);
    const V = buildVars(sk);
    const n = V.vars.length;
    if (opts.drag) {
      // 1) spostamento "morbido" verso la posizione del mouse (uno o più punti, o il raggio di un cerchio)
      const drags = Array.isArray(opts.drag) ? opts.drag : [opts.drag];
      const save = V.vars.map(([e, k]) => e[k]);
      const rows = [];
      for (const dg of drags) {
        const d = V.E.get(dg.id); if (!d) continue;
        if (dg.x !== undefined && V.idx.has(d.id + '.x')) rows.push({ d, k: 'x', i: V.idx.get(d.id + '.x'), v: dg.x }, { d, k: 'y', i: V.idx.get(d.id + '.y'), v: dg.y });
        if (dg.r !== undefined && V.idx.has(d.id + '.r')) rows.push({ d, k: 'r', i: V.idx.get(d.id + '.r'), v: dg.r });
      }
      if (rows.length) {
        for (let it = 0; it < 30; it++) {
          const { J, r } = jacobian(sk, V);
          const w = 0.01;
          for (const rw of rows) { const row = new Array(n).fill(0); row[rw.i] = w; J.push(row); r.push(w * (rw.d[rw.k] - rw.v)); }
          const dx = lsqStep(J, r, 1e-9);
          if (!dx) break;
          let mx = 0;
          V.vars.forEach(([e, k], j) => { e[k] += dx[j]; mx = Math.max(mx, Math.abs(dx[j])); });
          if (mx < 1e-10) break;
        }
      }
      const res = project(sk, V);
      if (!res.ok) { V.vars.forEach(([e, k], j) => { e[k] = save[j]; }); project(sk, V); return { ok: false, rejected: true }; }
      return res;
    }
    return project(sk, V);
  }
  // minimi quadrati: (Jt J + mu I) dx = -Jt r
  function lsqStep(J, r, mu) {
    const m = r.length, n = J[0] ? J[0].length : 0;
    if (!n) return null;
    const A = [];
    for (let a = 0; a < n; a++) {
      const row = new Array(n).fill(0);
      for (let b = 0; b < n; b++) { let s = 0; for (let i = 0; i < m; i++) s += J[i][a] * J[i][b]; row[b] = s; }
      row[a] += mu;
      A.push(row);
    }
    const g = new Array(n).fill(0);
    for (let a = 0; a < n; a++) { let s = 0; for (let i = 0; i < m; i++) s += J[i][a] * r[i]; g[a] = -s; }

  // proiezione sui vincoli (Newton a norma minima, con ricerca lineare)
  function project(sk, V) {

      const nr = norm2(r);
      if (nr < 1e-10) return { ok: true, iters: it, residual: nr };
      if (!V.vars.length) return { ok: nr < 1e-8, residual: nr };
      let dx = newtonStep(J, r, 1e-12);
      if (!dx) dx = newtonStep(J, r, 1e-6);
      if (!dx) return { ok: false, residual: nr };
      // ricerca lineare
      const save = V.vars.map(([e, k]) => e[k]);
      let step = 1, improved = false;
      for (let ls = 0; ls < 12; ls++) {
        V.vars.forEach(([e, k], j) => { e[k] = save[j] + dx[j] * step; });

      }
      if (!improved) { V.vars.forEach(([e, k], j) => { e[k] = save[j]; }); return { ok: nr < 1e-8, residual: nr }; }
      last = nr;
    }
    const r = []; residuals(sk, V.E, r);
    return { ok: norm2(r) < 1e-8, residual: norm2(r) };
  }

  // gli archi tengono l'estremo b alla stessa distanza dal centro (dopo modifiche manuali)
  function normalizeArcs(sk) {
    const E = byId(sk);
    for (const e of sk.ents) if (e.t === 'ar') {
      const c = E.get(e.c), a = E.get(e.a), b = E.get(e.b);
      if (!c || !a || !b) continue;
    }
  }

  /* ---------------- stato di definizione ---------------- */
  // restituisce { dof, status: 'under'|'full'|'over', free: Set(id entità non definite), conflicts: [con] }
  function analyze(sk) {

    const { J, r } = jacobian(sk, V);
    const m = r.length;
    const resid = norm2(r);
    if (n === 0) return { dof: 0, status: resid > 1e-7 ? 'over' : (m ? 'full' : 'full'), free: new Set(), redundant: false, unsolved: resid > 1e-7 };
    let s = [], Vm = null;

    const freeVar = new Array(n).fill(false);

    else for (const j of nullCols) for (let i = 0; i < n; i++) if (Math.abs(Vm[i][j]) > 1e-6) freeVar[i] = true;
    V.vars.forEach(([e, k], i) => { if (freeVar[i]) free.add(e.id); });
    // entità composte: una linea è libera se lo è un suo estremo
    const E = V.E;
    const freeEnt = new Set();
    for (const e of sk.ents) {
      if (e.t === 'pt' && free.has(e.id)) freeEnt.add(e.id);
      if (e.t === 'ln' && (free.has(e.a) || free.has(e.b))) freeEnt.add(e.id);
      if (e.t === 'ci' && (free.has(e.id) || free.has(e.c))) freeEnt.add(e.id);
      if (e.t === 'ar' && (free.has(e.c) || free.has(e.a) || free.has(e.b))) freeEnt.add(e.id);
    }
    const redundant = rank < m;
    const unsolved = resid > 1e-7;
    let status = dof > 0 ? 'under' : 'full';
    if (unsolved || redundant) status = 'over';
    return { dof, status, free: freeEnt, redundant, unsolved, rank, m, n };
  }

  // rango del jacobiano dei vincoli
  function rankOf(sk) {
    const V = buildVars(sk);
    const { J, r } = jacobian(sk, V);
    const m = r.length, n = V.vars.length;
    if (!m || !n) return { rank: 0, m, n };
    const d = svd(J, m, n);
    const smax = Math.max(1e-12, ...d.s);

  function wouldOverdefine(sk, con) {

    const b = rankOf(sk);
    sk.cons.pop();
    return (b.rank - a.rank) < (b.m - a.m);
  }

  /* ---------------- valori misurati (per quote condotte e per i valori iniziali) ---------------- */
  function measure(sk, c) {
    const E = byId(sk);
    const P = id => { const p = E.get(id); return [p.x, p.y]; };
    const L = id => { const l = E.get(id); return [P(l.a), P(l.b)]; };
    const R = id => { const e = E.get(id); if (e.t === 'ci') return e.r; const cc = P(e.c), a = P(e.a); return Math.hypot(a[0] - cc[0], a[1] - cc[1]); };

    switch (c.t) {

      case 'len': { const [a, b] = L(e[0]); return Math.hypot(b[0] - a[0], b[1] - a[1]); }
      case 'hdist': { const p = P(e[0]), q = P(e[1]); return Math.abs(q[0] - p[0]); }
      case 'vdist': { const p = P(e[0]), q = P(e[1]); return Math.abs(q[1] - p[1]); }
      case 'ptLine': { const p = P(e[0]), [a, b] = L(e[1]); const d = [b[0] - a[0], b[1] - a[1]]; return Math.abs(d[0] * (p[1] - a[1]) - d[1] * (p[0] - a[0])) / Math.hypot(d[0], d[1]); }
      case 'lineLine': { const [a, b] = L(e[0]), [p] = L(e[1]); const d = [b[0] - a[0], b[1] - a[1]]; return Math.abs(d[0] * (p[1] - a[1]) - d[1] * (p[0] - a[0])) / Math.hypot(d[0], d[1]); }
      case 'radius': return R(e[0]);
      case 'diameter': return 2 * R(e[0]);
      case 'angle': {

        let d1 = [b[0] - a[0], b[1] - a[1]], d2 = [q[0] - p[0], q[1] - p[1]];
        if (c.flip1) d1 = [-d1[0], -d1[1]];
        if (c.flip2) d2 = [-d2[0], -d2[1]];
        return Math.abs(Math.atan2(d1[0] * d2[1] - d1[1] * d2[0], d1[0] * d2[0] + d1[1] * d2[1])) * 180 / Math.PI;
      }
    }
    return 0;
  }

  /* ---------------- contorni chiusi ---------------- */
  // restituisce { regions: [{outer, holes}], loops, errors: [testo], axis: [linee di mezzeria] }
  function profiles(sk) {
    const E = byId(sk);
    const geo = sk.ents.filter(e => (e.t === 'ln' || e.t === 'ar' || e.t === 'ci') && !e.cons && !e.ext);
    const errors = [];
    // nodi: punti uniti per posizione
    const nodes = [];
    const nodeOf = id => {
      const p = E.get(id);
      for (let i = 0; i < nodes.length; i++) if (Math.hypot(nodes[i].x - p.x, nodes[i].y - p.y) < 1e-6) return i;
      nodes.push({ x: p.x, y: p.y, edges: [] });
      return nodes.length - 1;
    };
    const loops = [];
    const edges = [];
    for (const g of geo) {
      if (g.t === 'ci') { const c = E.get(g.c); loops.push([{ type: 'arc', c: [c.x, c.y], r: g.r, a0: 0, a1: TAU, id: g.id }]); continue; }
      if (g.t === 'ln') {
        const a = E.get(g.a), b = E.get(g.b);
        if (Math.hypot(a.x - b.x, a.y - b.y) < 1e-9) continue;
        const ia = nodeOf(g.a), ib = nodeOf(g.b);
        const ed = { g, ia, ib }; edges.push(ed); nodes[ia].edges.push(ed); nodes[ib].edges.push(ed);
      } else {
        const ia = nodeOf(g.a), ib = nodeOf(g.b);
        const ed = { g, ia, ib }; edges.push(ed); nodes[ia].edges.push(ed); nodes[ib].edges.push(ed);
      }

    const segs = geoSegments(sk, geo);

      const pts = intersectSeg(segs[i], segs[j]);
      for (const p of pts) {
        const atEndI = segs[i].ends.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < 1e-6);
        const atEndJ = segs[j].ends.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < 1e-6);
        if (!(atEndI && atEndJ)) { errors.push('Alcune entità si intersecano: usa «Taglia entità» per eliminare le parti in più, così i contorni sono chiusi e separati.'); i = segs.length; break; }
      }

    for (const n of nodes) {
      if (n.edges.length === 1) errors.push('Il contorno è aperto: un estremo non è collegato a nessun\'altra entità.');
      else if (n.edges.length > 2) errors.push('Tre o più entità si incontrano nello stesso punto: il contorno deve essere una linea chiusa senza diramazioni.');
    }
    const used = new Set();
    if (!errors.length) {
      for (const start of edges) {
        if (used.has(start)) continue;
        const loop = [];
        let cur = start, from = start.ia;
        let guard = 0;
        while (cur && !used.has(cur) && guard++ < 10000) {
          used.add(cur);
          const to = cur.ia === from ? cur.ib : cur.ia;
          loop.push(segOf(E, cur.g, from === cur.ia));
          const nx = nodes[to].edges.find(e => e !== cur && !used.has(e));
          from = to; cur = nx;

        loops.push(loop);
      }

    const areas = polys.map(p => polyArea(p));

    polys.forEach((p, i) => {

      polys.forEach((q, j) => { if (depth[j] === depth[i] + 1 && pointInPoly(q[0], p)) holes.push(loops[j]); });
      regions.push({ outer: loops[i], holes, area: Math.abs(exactArea[i]) - holes.reduce((s, h) => s + Math.abs(loopArea(h)), 0) });
    });
    const axes = sk.ents.filter(e => e.t === 'ln' && e.center).map(l => { const a = E.get(l.a), b = E.get(l.b); return { id: l.id, a: [a.x, a.y], b: [b.x, b.y] }; });
    return { regions, loops, errors: [...new Set(errors)], axes };
  }
  // catene di entità (aperte o chiuse) per percorsi e nervature: segmenti ordinati e orientati
  function chains(sk) {
    const E = byId(sk);
    const geo = sk.ents.filter(e => (e.t === 'ln' || e.t === 'ar' || e.t === 'ci') && !e.cons && !e.ext);
    const nodes = [], edges = [], out = [], errors = [];
    const nodeOf = id => {
      const p = E.get(id);
      for (let i = 0; i < nodes.length; i++) if (Math.hypot(nodes[i].x - p.x, nodes[i].y - p.y) < 1e-6) return i;
      nodes.push({ x: p.x, y: p.y, edges: [] }); return nodes.length - 1;
    };
    for (const g of geo) {
      if (g.t === 'ci') { const c = E.get(g.c); out.push({ segs: [{ type: 'arc', c: [c.x, c.y], r: g.r, a0: 0, a1: TAU, id: g.id }], closed: true }); continue; }
      if (g.t === 'ln') { const a = E.get(g.a), b = E.get(g.b); if (Math.hypot(a.x - b.x, a.y - b.y) < 1e-9) continue; }
      const ia = nodeOf(g.a), ib = nodeOf(g.b);
      const ed = { g, ia, ib }; edges.push(ed); nodes[ia].edges.push(ed); nodes[ib].edges.push(ed);
    }
    if (nodes.some(n => n.edges.length > 2)) errors.push('Tre o più entità si incontrano nello stesso punto: il percorso deve essere una sola linea senza diramazioni.');
    const used = new Set();
    if (!errors.length) {

      const starts = edges.filter(e => nodes[e.ia].edges.length === 1 || nodes[e.ib].edges.length === 1).concat(edges);
      for (const start of starts) {

  }
  function segStart(s) { return s.type === 'line' ? s.a : [s.c[0] + s.r * Math.cos(s.a0), s.c[1] + s.r * Math.sin(s.a0)]; }

    }
    const c = E.get(g.c), a = E.get(g.a), b = E.get(g.b);
    const r = Math.hypot(a.x - c.x, a.y - c.y);
    let a0 = Math.atan2(a.y - c.y, a.x - c.x), a1 = Math.atan2(b.y - c.y, b.x - c.x);
    while (a1 <= a0 + 1e-12) a1 += TAU;

    return { type: 'arc', c: [c.x, c.y], r, a0: a1, a1: a0, id: g.id };
  }
  function sampleLoop(loop) {
    const pts = [];
    for (const s of loop) {

      else { const n = Math.max(8, Math.ceil(Math.abs(s.a1 - s.a0) / 0.05)); for (let i = 0; i < n; i++) { const t = s.a0 + (s.a1 - s.a0) * i / n; pts.push([s.c[0] + s.r * Math.cos(t), s.c[1] + s.r * Math.sin(t)]); } }

  /* ---------------- geometria delle entità (intersezioni, taglio) ---------------- */
  function geoSegments(sk, list) {
    const E = byId(sk);
    return list.map(g => {
      if (g.t === 'ln') { const a = E.get(g.a), b = E.get(g.b); return { kind: 'l', a: [a.x, a.y], b: [b.x, b.y], ends: [[a.x, a.y], [b.x, b.y]], id: g.id }; }

  // chiede di scegliere un piano/faccia nella vista (con i piani visibili)
  App.pickPlaneFor = function (hint, cb) {
    const prevPlanes = App.showPlanes;
    // vista normale a un piano: i piani standard si vedono di taglio, si passa all'isometrica
    const bk = App.r.basis().back;
    if (['front', 'top', 'right'].some(id => Math.abs(dot(Model.STD_PLANES[id].F.z, bk)) < 0.08)) {
      App.r.setView(GLView.Renderer.viewQ('iso'));
      // inquadra anche i piani
      const bx = { mn: [Infinity, Infinity, Infinity], mx: [-Infinity, -Infinity, -Infinity] };
      for (const id of ['front', 'top', 'right']) for (const q of planeCorners(Model.STD_PLANES[id].F)) for (let k = 0; k < 3; k++) { bx.mn[k] = Math.min(bx.mn[k], q[k]); bx.mx[k] = Math.max(bx.mx[k], q[k]); }
      App.r.fit(true, bx);
    }
    App.openPM({
      title: 'Schizzo', icon: 'sketch', hint,
      filter: ['plane', 'face'],
      planes: () => ['front', 'top', 'right'],
      build(b) {

  function crc32(u8) { let c, crc = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) { c = (crc ^ u8[i]) & 0xFF; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; crc = (crc >>> 8) ^ c; } return (crc ^ 0xFFFFFFFF) >>> 0; }
  function zipOne(name, u8) {
    const nm = new TextEncoder().encode(name), crc = crc32(u8), n = u8.length;
    const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true); lh.setUint16(26, nm.length, true);

    const cdOff = 30 + nm.length + n, cdLen = 46 + nm.length;
    const end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true); end.setUint32(12, cdLen, true); end.setUint32(16, cdOff, true);

  /* ---------------- sezioni ---------------- */
  function sectionBody(st, plane, offset, nView) {

    const Fp = Model.STD_PLANES[plane].F;
    const n = nView;
    const bb = CSG.bbox(st.body);
    const R = len(sub(bb.mx, bb.mn)) * 2 + 10;
    const c = mul(add(bb.mn, bb.mx), 0.5);

  // tratteggio a 45° delle superfici di taglio (in coordinate di vista)

      const iv = [];
      for (const p of polys2) {
        const ts = [];
        for (let i = 0; i < p.length; i++) {
          const a = p[i], b = p[(i + 1) % p.length];

  }

  /* ---------------- stato della tavola ---------------- */

    return {

        const p1l = b.pt(r1 * nx, -r1 * ny), p2l = b.pt(dd + r2 * nx, -r2 * ny);

  LS.list = LIST;

  /* ---------------- riferimento: proprietà e tavola ---------------- */
  const refCache = new Map();
  function ref(lesson) {
    if (refCache.has(lesson.id)) return refCache.get(lesson.id);
    const doc = lesson.build();
    const st = Model.regen(doc);
    if (st.errors.size) console.warn('Errori nel riferimento', lesson.id, [...st.errors]);
    const mp = Model.massProperties(st, doc);
    const r = { doc, st, mp };
    refCache.set(lesson.id, r);
    return r;
  }
  LS.ref = ref;
  function refDrawing(lesson) {
    const r = ref(lesson);
    if (r.svg) return r.svg;
    const ds = { sheet: lesson.sheet || 'A4H', scale: 'auto', views: lesson.views || { front: true, top: true, left: true, iso: true }, hidden: true, offsets: {}, section: lesson.section || null, dims: [], axes: true,
      title: { school: 'Banco CAD – Esercitazioni', title: lesson.title, author: '', date: '', number: 'ES. ' + (LIST.indexOf(lesson) + 1), classe: '', tol: 'ISO 2768-mK', notes: 'Disegno di consegna: modella il pezzo e premi Verifica.' } };
    const first = Drawing.render({ st: r.st, ds, doc: r.doc });
    ds.dims = Drawing.smartDims(first.L, ds);
    r.svg = Drawing.render({ st: r.st, ds, doc: r.doc }).svg;
    return r.svg;
  }
  LS.refDrawing = refDrawing;

  /* ---------------- verifica ---------------- */
  function verify(lesson) {
    const App = A();
    const r = ref(lesson);
    const st = App.st;
    const checks = [];
    if (!st || !st.body.length) return [{ ok: false, text: 'Non c\'è ancora nessun solido nella parte.' }];
    const errs = st.errors.size;
    checks.push({ ok: !errs, text: errs ? 'Ci sono funzioni con errori nell\'albero: correggile prima.' : 'Nessuna funzione con errori.' });
    const m = Model.massProperties(st, App.doc);
    const rel = (a, b) => Math.abs(a - b) / Math.abs(b);
    const ext = mp => [mp.bbox.mx[0] - mp.bbox.mn[0], mp.bbox.mx[1] - mp.bbox.mn[1], mp.bbox.mx[2] - mp.bbox.mn[2]].sort((a, b) => a - b);
    const e1 = ext(m), e2 = ext(r.mp);
    const extOk = e1.every((v, i) => Math.abs(v - e2[i]) < 0.01);
    checks.push({ ok: extOk, text: extOk ? `Ingombro corretto: ${e2.map(x => App.fmt(x)).join(' × ')} mm.` : `Ingombro: il tuo pezzo misura ${e1.map(x => App.fmt(x)).join(' × ')} mm, quello richiesto ${e2.map(x => App.fmt(x)).join(' × ')} mm.` });
    const vOk = rel(m.volume, r.mp.volume) < 1e-4;
    checks.push({ ok: vOk, text: vOk ? `Volume corretto: ${App.fmt(r.mp.volume)} mm³.` : `Volume: ${App.fmt(m.volume)} mm³ invece di ${App.fmt(r.mp.volume)} mm³ (differenza ${App.fmt(m.volume - r.mp.volume)} mm³): controlla fori, smussi e quote.` });
    const aOk = rel(m.area, r.mp.area) < 1e-4;
    checks.push({ ok: aOk, text: aOk ? 'Area della superficie corretta.' : `Area della superficie: ${App.fmt(m.area)} mm² invece di ${App.fmt(r.mp.area)} mm² (forse manca o è in più un raccordo, uno smusso o un foro).` });
    // schizzi completamente definiti
    let under = 0;
    for (const f of App.doc.features) if (f.type === 'sketch' && !f.suppressed) { try { const a = Sketch.analyze(f.sk); if (a.status !== 'full') under++; } catch (e) { /* ignora */ } }
    checks.push({ ok: !under, warn: true, text: under ? `${under} ${under === 1 ? 'schizzo non è' : 'schizzi non sono'} completamente ${under === 1 ? 'definito' : 'definiti'} (in blu): un buon modello ha tutti gli schizzi neri.` : 'Tutti gli schizzi sono completamente definiti.' });
    if (lesson.id === 'flangia') { const ok = App.doc.material === 'c40'; checks.push({ ok, text: ok ? 'Materiale: Acciaio C40.' : 'Materiale: assegna Acciaio C40 (Valuta › Materiale).' }); }
    return checks;
  }
  LS.verify = verify;

  /* ---------------- interfaccia ---------------- */
  let current = null, lastChecks = null;
  LS.init = function () {
    const App = A();
    current = LIST.find(l => l.id === App.lessonId) || null;
  };
  LS.handles = id => ['lList', 'lVerify', 'lDrawing', 'lStart'].includes(id);
  LS.toolbar = function () {
    return [
      ['lList', 'Elenco', 'Tutte le esercitazioni', { icon: 'views3' }],
      ['lDrawing', 'Tavola di consegna', 'Il disegno quotato del pezzo da modellare', { icon: 'drawing', disabled: !current }],
      ['lStart', 'Nuova parte', 'Comincia l\'esercitazione da una parte vuota', { icon: 'sketch', disabled: !current }],
      ['lVerify', 'Verifica il modello', 'Confronta il tuo pezzo con quello richiesto', { icon: 'verify', disabled: !current }],
    ];
  };
  LS.cmd = function (id) {
    switch (id) {
      case 'lList': current = null; render(); return;
      case 'lDrawing': if (current) showDrawing(current); return;
      case 'lStart': if (current) startLesson(current); return;
      case 'lVerify': if (current) { lastChecks = verify(current); render(); openPanel(); } return;
    }
  };
  LS.open = function () { openPanel(); render(); };
  function openPanel() { const App = A(); document.querySelector('#right').hidden = false; App.rightPanel = 'lessons'; }
  function render() {
    const App = A(), el = App.el;
    const body = document.querySelector('#rightBody');
    body.innerHTML = '';
    document.querySelector('#rightTitle').textContent = current ? 'Esercitazione ' + (LIST.indexOf(current) + 1) : 'Esercitazioni';
    App.updateCommands();
    if (!current) {
      body.append(el('p', { class: 'note' }, 'Ogni esercitazione ha una tavola quotata da riprodurre. Alla fine «Verifica il modello» confronta il tuo pezzo con quello richiesto (ingombro, volume, superficie).'));
      const list = el('div', { class: 'les-list' });
      const done = getDone();
      LIST.forEach((l, i) => {
        const b = el('button', { class: 'les-item' + (done.has(l.id) ? ' done' : ''), type: 'button', onclick: () => { current = l; App.lessonId = l.id; App.save(); lastChecks = null; render(); } },
          el('span', { class: 'n' }, String(i + 1)), el('span', { class: 't' }, l.title), el('span', { class: 'm' }, l.level + ' · ' + l.time));
        list.append(b);
      });
      body.append(list);
      return;
    }
    const l = current;
    const wrap = el('div', { class: 'les' });
    wrap.append(el('button', { class: 'btn btn-small', type: 'button', onclick: () => { current = null; render(); } }, '← Tutte le esercitazioni'));
    wrap.append(el('h3', {}, l.title), el('span', { class: 'pill' }, l.level + ' · ' + l.time));
    wrap.append(el('p', { class: 'goal' }, l.goal));
    const dr = el('div', { class: 'refdraw', title: 'Clic per ingrandire', html: refDrawing(l) });
    dr.addEventListener('click', () => showDrawing(l));
    wrap.append(el('h4', {}, 'Tavola di consegna'), dr);
    const ol = el('ol');
    for (const s of l.steps) ol.append(el('li', {}, s));
    wrap.append(el('h4', {}, 'Procedimento consigliato'), ol);
    const r = ref(l);
    wrap.append(el('h4', {}, 'Dati del pezzo richiesto'), el('dl', { class: 'kv' },
      el('dt', {}, 'Volume'), el('dd', {}, App.fmt(r.mp.volume) + ' mm³'),
      el('dt', {}, 'Area della superficie'), el('dd', {}, App.fmt(r.mp.area) + ' mm²')));
    const act = el('div', { class: 'btnrow', style: 'margin-top:10px' },
      el('button', { class: 'btn', type: 'button', onclick: () => startLesson(l) }, 'Nuova parte per l\'esercizio'),
      el('button', { class: 'btn btn-primary', type: 'button', onclick: () => { lastChecks = verify(l); if (lastChecks.filter(c => !c.warn).every(c => c.ok)) markDone(l.id); render(); } }, 'Verifica il modello'));
    wrap.append(act);
    if (lastChecks) {
      const ul = el('ul', { class: 'checks' });
      for (const c of lastChecks) ul.append(el('li', {}, el('span', { class: c.ok ? 'ok' : 'no' }, c.ok ? '✓' : (c.warn ? '!' : '✗')), el('span', {}, c.text)));
      wrap.append(el('h4', {}, 'Risultato della verifica'), ul);
      if (lastChecks.filter(c => !c.warn).every(c => c.ok)) wrap.append(el('p', { class: 'note ok' }, 'Il pezzo corrisponde alla tavola. Ora prova la messa in tavola: scheda Messa in tavola › Quote di ingombro.'));
    }
    wrap.append(el('h4', {}, 'Soluzione'), el('button', { class: 'btn btn-small', type: 'button', onclick: () => loadSolution(l) }, 'Carica il modello risolto (sostituisce la parte)'));
    body.append(wrap);
  }
  function showDrawing(l) {
    const App = A();
    App.modal(l.title, `<div style="background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:70vh">${refDrawing(l).replace('<svg ', '<svg style="width:100%;height:auto;min-width:640px" ')}</div>`, [
      { label: 'Esporta SVG', fn: () => App.offerFile(l.id + '-consegna.svg', 'image/svg+xml', refDrawing(l), 'Tavola di consegna') },
      { label: 'Chiudi', primary: true },
    ]);
    const card = document.querySelector('.modal-card'); if (card) card.style.width = 'min(1100px, 100%)';
  }
  function startLesson(l) {
    const App = A();
    const go = () => {
      if (App.mode === 'sketch') Sketcher.exit(false);
      App.change(() => { App.doc = Model.newDoc(); App.doc.name = l.title; App.sel = []; App.drawingState = null; });
      document.querySelector('#docName').value = l.title;
      App.lessonId = l.id; App.save();
      App.r.setView(GLView.Renderer.viewQ('iso'));
      App.r.fit();
      App.setCmdTab('sketch');
      current = l; openPanel(); render();
    };
    if (App.doc.features.length) App.confirm('Nuova parte per l\'esercizio', 'La parte attuale verrà sostituita da una parte vuota (puoi tornare indietro con Annulla).', 'Comincia', go);
    else go();
  }
  function loadSolution(l) {
    const App = A();
    App.confirm('Caricare la soluzione?', 'La parte attuale verrà sostituita dal modello risolto. Prova prima a farlo da solo!', 'Carica', () => {
      if (App.mode === 'sketch') Sketcher.exit(false);
      const doc = JSON.parse(JSON.stringify(ref(l).doc));
      App.change(() => { App.doc = doc; App.sel = []; App.drawingState = null; });
      document.querySelector('#docName').value = doc.name;
      App.r.fit();
    });
  }
  function getDone() { try { return new Set(JSON.parse(localStorage.getItem('banco-cad-done') || '[]')); } catch (e) { return new Set(); } }
  function markDone(id) { try { const s = getDone(); s.add(id); localStorage.setItem('banco-cad-done', JSON.stringify([...s])); } catch (e) { /* ignora */ } }
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init()); else App.init();
